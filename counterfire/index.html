<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Counterfire v062</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0c;color:#d8d3aa;font-family:Arial,Helvetica,sans-serif}
body{display:block}
#frame{position:fixed;inset:0;width:100vw;height:100vh;background:#315a64;box-shadow:none}
#frame.local2{width:100vw;height:100vh}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#315a64}
#badge{display:none!important}
#error{display:none;position:fixed;inset:18px;z-index:20;overflow:auto;padding:14px;background:#2b1010;color:#ffd4d4;border:2px solid #bd5555;white-space:pre-wrap;font:13px/1.4 monospace}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="480" height="300"></canvas>
  <div id="badge"></div>
</div>
<div id="error"></div>
<script>
(function(){
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const frameEl=document.getElementById('frame');
const badgeEl=document.getElementById('badge');
const errorBox=document.getElementById('error');
if(!ctx) throw new Error('Canvas 2D is not available.');
ctx.imageSmoothingEnabled=false;

window.addEventListener('error',e=>{
  errorBox.style.display='block';
  errorBox.textContent='JavaScript error:\n'+(e.message||e.error||'unknown')+'\n'+(e.filename||'')+':'+(e.lineno||'?')+':'+(e.colno||'?');
});
window.addEventListener('unhandledrejection',e=>{
  errorBox.style.display='block';
  errorBox.textContent='Unhandled promise error:\n'+String(e.reason||e);
});

const SCALE=1.5;
const LW=320,LH=200,LVIEW_H=158,LHUD_Y=158;
const BASE_W=Math.round(LW*SCALE),BASE_H=Math.round(LH*SCALE),BASE_VIEW_H=Math.round(LVIEW_H*SCALE);
const HUD_PIXEL_H=BASE_H-BASE_VIEW_H,NEAR=2.5;
const FOV=63*Math.PI/180;
let W=BASE_W,H=BASE_H,VIEW_H=BASE_VIEW_H,HUD_Y=BASE_VIEW_H;
let FOCAL=(W*0.5)/Math.tan(FOV*0.5);
let frame=null,pixels=null,zbuf=null;
const keys=Object.create(null);
let gameMode=null; // null = mode menu, 'single' = player vs AI, 'local2' = two humans
// CPU reinforcement pressure is independent from the per-side handicaps.
// KEY 7 changes how many computer vehicles may be active simultaneously.
const CPU_MAX_ACTIVE_OPTIONS=[1,2,3,4];
let cpuMaxActiveOptionIndex=0;
function cpuMaxActive(){return CPU_MAX_ACTIVE_OPTIONS[cpuMaxActiveOptionIndex];}
function cycleCpuMaxActive(dir=1){
  const n=CPU_MAX_ACTIVE_OPTIONS.length;cpuMaxActiveOptionIndex=(cpuMaxActiveOptionIndex+dir+n)%n;
}
const CPU_SPAWN_DELAY=20;
let cpuSpawnTimer=0,cpuFirstSpawn=true,cpuSpawnSerial=0;

// Per-side handicap controls. Vulnerability is the fraction of incoming vehicle
// damage applied. Vehicle sets define how many complete Tank/Helicopter/ASV/Jeep
// sets are available to that side; Infinity keeps the classic unlimited-pool option.
const VULNERABILITY_OPTIONS=[.20,.50,1.00];
const VEHICLE_SET_OPTIONS=[1,2,4,Infinity];
const vulnerabilityOptionIndex=[2,2];
const vehicleSetOptionIndex=[1,1];
function teamVulnerability(team){return VULNERABILITY_OPTIONS[vulnerabilityOptionIndex[team]??2];}
function configuredVehicleStock(team){return VEHICLE_SET_OPTIONS[vehicleSetOptionIndex[team]??1];}
function cycleTeamVulnerability(team,dir=1){
  const n=VULNERABILITY_OPTIONS.length;vulnerabilityOptionIndex[team]=(vulnerabilityOptionIndex[team]+dir+n)%n;
}
function cycleTeamVehicleSets(team,dir=1){
  const n=VEHICLE_SET_OPTIONS.length;vehicleSetOptionIndex[team]=(vehicleSetOptionIndex[team]+dir+n)%n;
}
function vulnerabilityLabel(team){return Math.round(teamVulnerability(team)*100)+'%';}
function vehicleSetsLabel(team){const n=configuredVehicleStock(team);return Number.isFinite(n)?String(n):'UNLIMITED';}

// ---------------------------------------------------------------------------
// Keyboard/browser-shortcut protection
// ---------------------------------------------------------------------------
// Browser-reserved shortcuts cannot be guaranteed from ordinary page JS.  We
// therefore combine three layers: preventDefault on every game-control chord,
// Keyboard Lock when Chromium exposes it, and a beforeunload guard so Ctrl+W
// becomes a confirmation rather than an instant lost match.
const GAME_KEY_CODES=new Set([
  'KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyC','KeyZ','KeyX','KeyR',
  'ControlLeft','ControlRight','ShiftLeft','ShiftRight','Space','Tab','Enter',
  'Backspace','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Comma','Period',
  'Slash','Quote','Semicolon','NumpadEnter','Numpad8','Numpad2','Numpad5','Numpad1'
]);
function suppressBrowserShortcut(e){
  if(gameMode===null)return;
  if(GAME_KEY_CODES.has(e.code)||e.ctrlKey||e.metaKey){
    e.preventDefault();
    e.stopPropagation();
  }
}
async function tryKeyboardLock(){
  if(gameMode!=='local2'||!navigator.keyboard||!navigator.keyboard.lock)return;
  try{
    await navigator.keyboard.lock(Array.from(GAME_KEY_CODES).concat(['Escape']));
  }catch(_){ /* fallback layers above remain active */ }
}
async function enterGameFullscreenAndLock(){
  // Local two-player is where Ctrl+W is a natural key chord (ground fire + W).
  // Fullscreen gives Keyboard Lock the best chance to capture it.
  if(gameMode!=='local2'){return;}
  try{
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen({navigationUI:'hide'});
    }
  }catch(_){ /* fullscreen may be denied, continue with beforeunload guard */ }
  await tryKeyboardLock();
}
function releaseKeyboardLock(){
  try{if(navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();}catch(_){}
}
window.addEventListener('beforeunload',e=>{
  if(gameMode===null)return;
  e.preventDefault();
  e.returnValue='';
});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)tryKeyboardLock();});

// ---------------------------------------------------------------------------
// Procedural Web Audio: no external files, suitable for file:// execution.
// ---------------------------------------------------------------------------
const audio={ctx:null,master:null,sfx:null,music:null,compressor:null,noiseBuffer:null,voices:[null,null],lastExplosion:-99};
function audioPanForX(x){return clamp((x/world.width)*1.35-.675,-.72,.72);}
function teamPan(team){return gameMode==='local2'?(team===0?-.38:.38):(team===0?-.12:.18);}
function ensureAudio(){
  if(audio.ctx){if(audio.ctx.state==='suspended')audio.ctx.resume().catch(()=>{});return audio.ctx;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const ac=new AC();audio.ctx=ac;
  // Engines/music stay moderate, while combat effects get a hotter dedicated bus.
  // A compressor catches the peaks so cannon shots/explosions can have real weight
  // without hard-clipping the browser output.
  audio.compressor=ac.createDynamicsCompressor();
  audio.compressor.threshold.value=-14;
  audio.compressor.knee.value=8;
  audio.compressor.ratio.value=5.5;
  audio.compressor.attack.value=.0015;
  audio.compressor.release.value=.24;
  audio.compressor.connect(ac.destination);
  audio.master=ac.createGain();audio.master.gain.value=.90;audio.master.connect(audio.compressor);
  audio.sfx=ac.createGain();audio.sfx.gain.value=1.42;audio.sfx.connect(audio.master);
  audio.music=ac.createGain();audio.music.gain.value=.58;audio.music.connect(audio.master);
  const len=Math.max(1,Math.floor(ac.sampleRate*1.5));
  audio.noiseBuffer=ac.createBuffer(1,len,ac.sampleRate);
  const d=audio.noiseBuffer.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return ac;
}
function makeStereoPan(pan,dest){
  const ac=audio.ctx;if(!ac)return null;
  if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(dest);return p;}
  return dest;
}
function playTone(freq,dur=.12,gain=.08,type='sine',pan=0,when=0,endFreq=null,dest=null){
  const ac=ensureAudio();if(!ac)return;
  const t=ac.currentTime+Math.max(0,when),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,freq),t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const out=makeStereoPan(pan,dest||audio.sfx);o.connect(g);g.connect(out||dest||audio.sfx);o.start(t);o.stop(t+dur+.03);
}
function playNoise(dur=.15,gain=.08,filterHz=700,pan=0,when=0,dest=null){
  const ac=ensureAudio();if(!ac||!audio.noiseBuffer)return;
  const t=ac.currentTime+Math.max(0,when),src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=audio.noiseBuffer;src.loop=true;f.type='lowpass';f.frequency.value=filterHz;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const out=makeStereoPan(pan,dest||audio.sfx);src.connect(f);f.connect(g);g.connect(out||dest||audio.sfx);src.start(t);src.stop(t+dur+.03);
}
function playFilteredNoise(dur=.15,gain=.10,freq=1000,type='bandpass',q=1.0,pan=0,when=0){
  const ac=ensureAudio();if(!ac||!audio.noiseBuffer)return;
  const t=ac.currentTime+Math.max(0,when),src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=audio.noiseBuffer;src.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.0025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const out=makeStereoPan(pan,audio.sfx);src.connect(f);f.connect(g);g.connect(out||audio.sfx);src.start(t);src.stop(t+dur+.025);
}
function playCombatTone(freq,dur,gain,type='sine',pan=0,when=0,endFreq=null){
  const ac=ensureAudio();if(!ac)return;
  const t=ac.currentTime+Math.max(0,when),o=ac.createOscillator(),g=ac.createGain(),sh=ac.createWaveShaper();
  const curve=new Float32Array(257);for(let i=0;i<curve.length;i++){const x=i/(curve.length-1)*2-1;curve[i]=Math.tanh(x*2.4);}
  sh.curve=curve;sh.oversample='2x';o.type=type;o.frequency.setValueAtTime(Math.max(20,freq),t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.0025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const out=makeStereoPan(pan,audio.sfx);o.connect(sh);sh.connect(g);g.connect(out||audio.sfx);o.start(t);o.stop(t+dur+.03);
}
function playMelody(kind,team=0,x=null){
  const ac=ensureAudio();if(!ac)return;
  const pan=x===null?teamPan(team):audioPanForX(x);
  const tunes={
    reveal:[[392,.12],[523,.12],[659,.18]],
    pickup:[[523,.09],[659,.09],[784,.10],[1047,.18]],
    capture:[[523,.13],[659,.13],[784,.13],[1047,.18],[1319,.28]],
    resupply:[[659,.09],[880,.15]],
    deploy:[[220,.07],[330,.09],[440,.12]],
    return:[[440,.08],[330,.08],[220,.12]]
  };
  let t=0;for(const [f,d] of (tunes[kind]||[])){playTone(f,d,.055,'triangle',pan,t,null,audio.music);t+=d*.82;}
}
function playPoolSound(team,kind){
  const pan=teamPan(team);playNoise(.38,.045,420,pan,0);playTone(kind==='return'?120:85,.34,.05,'sawtooth',pan,0,kind==='return'?70:150);
  playMelody(kind,team);
}
function playWeaponSound(v,mode){
  const pan=teamPan(v.team);
  if(v.type==='tank'){
    // Cannon: hard supersonic crack + mid-pressure blast + short sub-bass recoil.
    playFilteredNoise(.035,.48,3600,'bandpass',1.35,pan,0);
    playFilteredNoise(.115,.33,950,'bandpass',.75,pan,.004);
    playFilteredNoise(.20,.22,310,'lowpass',.7,pan,.012);
    playCombatTone(112,.22,.34,'sine',pan,0,43);
    playCombatTone(55,.31,.24,'triangle',pan,.006,25);
  }else if(v.type==='asv'){
    // Rocket launch: ignition crack followed by a broad, lower roaring exhaust.
    playFilteredNoise(.045,.34,2900,'bandpass',1.0,pan,0);
    playFilteredNoise(.34,.28,760,'lowpass',.65,pan,.006);
    playFilteredNoise(.23,.20,1550,'bandpass',.8,pan,.018);
    playCombatTone(125,.27,.22,'sawtooth',pan,0,58);
    playCombatTone(49,.34,.17,'sine',pan,.012,27);
  }else if(v.type==='helicopter'){
    if(v.selectedWeapon==='rocket'){
      playFilteredNoise(.04,.29,3100,'bandpass',1.0,pan,0);
      playFilteredNoise(.27,.24,980,'lowpass',.7,pan,.006);
      playCombatTone(145,.22,.18,'sawtooth',pan,0,62);
    }else{
      playFilteredNoise(.026,.30,4300,'bandpass',1.55,pan,0);
      playFilteredNoise(.075,.17,1200,'bandpass',.9,pan,.002);
      playCombatTone(170,.09,.13,'triangle',pan,0,72);
    }
  }else if(v.type==='jeep'){
    // Grenade launcher: compact mechanical thump rather than a tiny click.
    playFilteredNoise(.035,.24,2200,'bandpass',1.2,pan,0);
    playFilteredNoise(.11,.17,620,'lowpass',.7,pan,.004);
    playCombatTone(105,.13,.18,'triangle',pan,0,48);
  }
  if(mode==='air')playTone(760,.06,.035,'sine',pan,.012,1040);
}
function playExplosionSound(x,power=1,water=false){
  const ac=ensureAudio();if(!ac)return;
  const now=ac.currentTime;if(now-audio.lastExplosion<.025&&power<1.05)return;audio.lastExplosion=now;
  const pan=audioPanForX(x),p=clamp(power,.60,2.0);
  const scale=.78+.38*p;
  // 1) extremely short high/mid pressure crack
  playFilteredNoise(.026+.012*p,.48*scale,water?2100:4200,'bandpass',1.4,pan,0);
  playFilteredNoise(.070+.020*p,.32*scale,water?1050:2100,'bandpass',.85,pan,.004);
  // 2) dense blast body: broad low-passed noise, not merely a click
  playFilteredNoise(.34+.16*p,.39*scale,water?390:720,'lowpass',.65,pan,.008);
  playFilteredNoise(.58+.22*p,.25*scale,water?180:330,'lowpass',.70,pan,.018);
  // 3) pressure-wave pitch sweeps.  These are deliberately strong; the
  // compressor limits peaks while preserving a much deeper perceived impact.
  playCombatTone(water?92:104,.36+.13*p,.43*scale,'sine',pan,0,water?31:34);
  playCombatTone(water?54:62,.62+.18*p,.34*scale,'triangle',pan,.008,22);
  playCombatTone(34,.82+.18*p,.25*scale,'sine',pan,.018,20);
  // 4) delayed debris/ground slap and long rumble for major detonations
  playFilteredNoise(.12+.035*p,.22*scale,1450,'bandpass',.65,pan,.085);
  if(p>1.05){
    playFilteredNoise(.85+.20*p,.20*scale,145,'lowpass',.8,pan,.055);
    playCombatTone(27,.95+.22*p,.19*scale,'triangle',pan,.05,20);
  }
  if(p>1.35){
    playFilteredNoise(.055,.25*scale,3300,'bandpass',1.0,pan,.14);
    playFilteredNoise(.16,.18*scale,800,'bandpass',.8,pan,.18);
  }
}
function playImpactSound(x){const pan=audioPanForX(x);playFilteredNoise(.032,.095,2800,'bandpass',1.1,pan);playFilteredNoise(.07,.055,620,'lowpass',.7,pan,.003);}
function playMineSound(v){const pan=teamPan(v.team);playTone(480,.04,.04,'square',pan);playTone(180,.08,.03,'triangle',pan,.04);}
function playDrownSound(v){const pan=teamPan(v.team);playNoise(.55,.065,500,pan);playTone(145,.55,.055,'sine',pan,0,48);}
function playTowerSound(t){const pan=audioPanForX(t.x);playFilteredNoise(.025,.19,3900,'bandpass',1.5,pan);playFilteredNoise(.065,.10,980,'bandpass',.9,pan,.002);playCombatTone(155,.075,.09,'triangle',pan,0,72);}
function stopEngineVoice(team){
  const v=audio.voices[team];if(!v)return;const ac=audio.ctx;
  if(ac)v.gain.gain.setTargetAtTime(.0001,ac.currentTime,.04);
  setTimeout(()=>{for(const n of v.sources){try{n.stop();}catch(_){}}},180);audio.voices[team]=null;
}
function createEngineVoice(type,team){
  const ac=ensureAudio();if(!ac)return null;
  const pan=makeStereoPan(teamPan(team),audio.master),gain=ac.createGain(),filter=ac.createBiquadFilter();
  gain.gain.value=.0001;filter.type='lowpass';filter.frequency.value=900;gain.connect(filter);filter.connect(pan||audio.master);
  const o1=ac.createOscillator(),o2=ac.createOscillator();o1.connect(gain);o2.connect(gain);o1.start();o2.start();
  const noise=ac.createBufferSource(),ng=ac.createGain(),nf=ac.createBiquadFilter();noise.buffer=audio.noiseBuffer;noise.loop=true;nf.type='lowpass';noise.connect(nf);nf.connect(ng);ng.connect(filter);noise.start();
  let lfo=null,lfoDepth=null;
  if(type==='helicopter'){
    lfo=ac.createOscillator();lfoDepth=ac.createGain();lfo.type='square';lfo.frequency.value=13;lfoDepth.gain.value=.018;lfo.connect(lfoDepth);lfoDepth.connect(ng.gain);lfo.start();
  }
  const voice={type,team,gain,filter,o1,o2,noise,ng,nf,lfo,lfoDepth,sources:[o1,o2,noise].concat(lfo?[lfo]:[])};
  audio.voices[team]=voice;return voice;
}
function updateEngineVoice(v,team){
  if(!audio.ctx)return;
  const poolState=team===0?pool.mode:cpuPool.mode;
  const audible=gameMode!==null&&v.alive&&(poolState==='active'||poolState==='deploying'||poolState==='returning');
  if(!audible){if(audio.voices[team])audio.voices[team].gain.gain.setTargetAtTime(.0001,audio.ctx.currentTime,.08);return;}
  let voice=audio.voices[team];if(!voice||voice.type!==v.type){stopEngineVoice(team);voice=createEngineVoice(v.type,team);if(!voice)return;}
  const ac=audio.ctx,t=ac.currentTime;
  const max=Math.max(1,v.maxForward||1),rpm=clamp(Math.abs(v.speed||0)/max,0,1);
  let f1=55,f2=28,level=.055,noise=.018,cut=700;
  if(v.type==='tank'){f1=47+rpm*30;f2=23+rpm*17;level=.067+rpm*.028;noise=.020+rpm*.018;cut=420+rpm*260;voice.o1.type='sawtooth';voice.o2.type='square';}
  else if(v.type==='asv'){f1=41+rpm*36;f2=82+rpm*50;level=.062+rpm*.032;noise=.022+rpm*.020;cut=500+rpm*330;voice.o1.type='sawtooth';voice.o2.type='triangle';}
  else if(v.type==='jeep'){f1=82+rpm*92;f2=164+rpm*120;level=.045+rpm*.035;noise=.012+rpm*.014;cut=800+rpm*520;voice.o1.type='sawtooth';voice.o2.type='triangle';}
  else {f1=88+rpm*24;f2=176+rpm*40;level=.052+rpm*.018;noise=.035+rpm*.018;cut=1100+rpm*550;voice.o1.type='triangle';voice.o2.type='sawtooth';if(voice.lfo)voice.lfo.frequency.setTargetAtTime(12.5+rpm*4.5,t,.06);}
  voice.o1.frequency.setTargetAtTime(f1,t,.05);voice.o2.frequency.setTargetAtTime(f2,t,.05);
  voice.ng.gain.setTargetAtTime(noise,t,.06);voice.nf.frequency.setTargetAtTime(cut,t,.08);voice.filter.frequency.setTargetAtTime(cut*1.25,t,.08);
  voice.gain.gain.setTargetAtTime(level,t,.08);
}
function updateAudio(){
  if(!audio.ctx)return;
  updateEngineVoice(player,0);
  updateEngineVoice(cpu,1);
  if(gameMode===null){for(let i=0;i<2;i++)if(audio.voices[i])audio.voices[i].gain.gain.setTargetAtTime(.0001,audio.ctx.currentTime,.05);}
}
function rebuildRenderBuffers(){
  frame=ctx.createImageData(W,VIEW_H);
  pixels=frame.data;
  zbuf=new Float64Array(W*VIEW_H);
}
function desiredViewportSize(){
  const cssW=Math.max(320,window.innerWidth||BASE_W);
  const cssH=Math.max(200,window.innerHeight||BASE_H);
  const split=gameMode==='local2';
  const perViewAspect=(split?cssW*.5:cssW)/cssH;
  const baseAspect=BASE_W/BASE_H;
  let w=BASE_W,h=BASE_H;
  // Never shrink the original software-rendered viewport. Expand one dimension
  // so the backing canvas has the same aspect ratio as its CSS display area.
  // CSS can then fill the browser without geometrically stretching the image.
  if(perViewAspect>=baseAspect)w=Math.max(BASE_W,Math.round(BASE_H*perViewAspect));
  else h=Math.max(BASE_H,Math.round(BASE_W/perViewAspect));
  return {w,h};
}
function applyCanvasLayout(){
  const split=gameMode==='local2';
  const size=desiredViewportSize();
  const changed=W!==size.w||H!==size.h;
  W=size.w;H=size.h;VIEW_H=Math.max(1,H-HUD_PIXEL_H);HUD_Y=VIEW_H;
  FOCAL=(W*0.5)/Math.tan(FOV*0.5);
  const targetW=split?W*2:W,targetH=H;
  if(canvas.width!==targetW||canvas.height!==targetH){canvas.width=targetW;canvas.height=targetH;ctx.imageSmoothingEnabled=false;}
  if(changed||!frame)rebuildRenderBuffers();
  frameEl.classList.toggle('local2',split);
}
addEventListener('resize',()=>applyCanvasLayout());
function startGameMode(mode){
  gameMode=mode;
  ensureAudio();
  if(mode==='local2')enterGameFullscreenAndLock();
  badgeEl.style.display='none';
  player.label='P1';
  cpu.label=mode==='local2'?'P2':'CPU';
  applyCanvasLayout();
  reset();
}
function returnToModeMenu(){
  releaseKeyboardLock();
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  gameMode=null;
  badgeEl.style.display='block';
  applyCanvasLayout();
  reset();
}
addEventListener('keydown',e=>{
  suppressBrowserShortcut(e);
  ensureAudio();
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace','NumpadEnter','Tab'].includes(e.code))e.preventDefault();
  if(pool.mode==='active'&&player.type==='helicopter'&&
     ((gameMode==='single'&&(e.code==='KeyA'||e.code==='KeyD'))||
      (gameMode==='local2'&&(e.code==='KeyQ'||e.code==='KeyE'))))e.preventDefault();

  if(gameMode===null){
    if(e.code==='ArrowLeft'){e.preventDefault();cycleBattlefield(-1);return;}
    if(e.code==='ArrowRight'||e.code==='KeyM'){e.preventDefault();cycleBattlefield(1);return;}
    if(e.code==='Digit3'||e.code==='Numpad3'){cycleTeamVulnerability(0);return;}
    if(e.code==='Digit4'||e.code==='Numpad4'){cycleTeamVehicleSets(0);return;}
    if(e.code==='Digit5'||e.code==='Numpad5'){cycleTeamVulnerability(1);return;}
    if(e.code==='Digit6'||e.code==='Numpad6'){cycleTeamVehicleSets(1);return;}
    if(e.code==='Digit7'||e.code==='Numpad7'){cycleCpuMaxActive();return;}
    if(e.code==='Digit1'||e.code==='Numpad1'){startGameMode('single');return;}
    if(e.code==='Digit2'||e.code==='Numpad2'){startGameMode('local2');return;}
    return;
  }
  if(e.code==='Escape'){returnToModeMenu();return;}
  if(e.code==='KeyR'){ reset(); return; }

  // Motor-pool selection follows each mode's movement keys.
  if(pool.mode==='select'){
    const p1Up=gameMode==='single'?(e.code==='ArrowUp'||e.code==='Numpad8'):e.code==='KeyW';
    const p1Down=gameMode==='single'?(e.code==='ArrowDown'||e.code==='Numpad2'):e.code==='KeyS';
    if(p1Up){if(!e.repeat)movePoolSelection(0,-1);return;}
    if(p1Down){if(!e.repeat)movePoolSelection(0,1);return;}
    const selectFire=gameMode==='local2'?e.code==='ControlLeft':e.code==='Space';
    if(selectFire){deploySelectedVehicle(0);return;}
  }
  if(gameMode==='local2'&&cpuPool.mode==='select'){
    if(e.code==='ArrowUp'||e.code==='Numpad8'){if(!e.repeat)movePoolSelection(1,-1);return;}
    if(e.code==='ArrowDown'||e.code==='Numpad2'){if(!e.repeat)movePoolSelection(1,1);return;}
    if(e.code==='ControlRight'){deploySelectedVehicle(1);return;}
  }

  if(gameMode==='local2'){
    if(e.code==='Tab' && pool.mode==='active')tryReturnToPool();
    if(e.code==='ControlLeft' && pool.mode==='active')fire(player,0,'ground');
    if(e.code==='ShiftLeft' && pool.mode==='active')fire(player,0,'air');
    if(e.code==='KeyZ' && pool.mode==='active')layMine(player);
  }else{
    if(e.code==='Enter' && pool.mode==='active')tryReturnToPool();
    if(e.code==='Space' && pool.mode==='active')fire(player,0,'ground');
    if((e.code==='KeyX'||e.code==='ShiftLeft') && pool.mode==='active')fire(player,0,'air');
    if(e.code==='KeyS' && pool.mode==='active')layMine(player);
  }
  if(e.code==='KeyC' && pool.mode==='active' && player.type==='helicopter')player.selectedWeapon=player.selectedWeapon==='shell'?'rocket':'shell';

  if(gameMode!=='local2')return;
  if((e.code==='Backspace'||e.code==='NumpadEnter') && cpuPool.mode==='active')tryP2ReturnToPool();
  if(e.code==='ControlRight' && cpuPool.mode==='active')fire(cpu,1,'ground');
  if(e.code==='ShiftRight' && cpuPool.mode==='active')fire(cpu,1,'air');
  if((e.code==='Quote'||e.code==='Numpad5') && cpuPool.mode==='active' && cpu.type==='helicopter')cpu.selectedWeapon=cpu.selectedWeapon==='shell'?'rocket':'shell';
  if((e.code==='Semicolon'||e.code==='Numpad1') && cpuPool.mode==='active')layMine(cpu);
});

    const q=clamp((pool.timer-.28)/.78,0,1);

function addBoxObject(kind,x,y,z,sx,sy,sz,yaw,color,health,team=-1,solid=true){
  return addObject({kind,shape:'rect',x,y,z,sx,sy,sz,yaw,color,health,team,solid,hx:sx*.5,hz:sz*.5});
}
function addCircleObject(kind,x,z,r,health,team=-1,extra={}){
  return addObject({kind,shape:'circle',x,z,r,health,team,...extra});

function addWallBlock(x,z,team){
  // AoE-like modular wall: every masonry block is a separate object with
  // its own collision and health.  Adjacent blocks touch visually, but a
  // destroyed block opens an actual tank-sized breach.
  return addBoxObject('wall',x,15,z,24,30,24,0,'#62645d',58,team);
}
function addWallLineX(x1,x2,z,team,gateHalfWidth=0){
  const step=24;
  const dir=x2>=x1?1:-1;
  for(let x=x1;dir>0?x<=x2:x>=x2;x+=step*dir){
    if(gateHalfWidth&&Math.abs(x-(x1+x2)*.5)<gateHalfWidth)continue;
    addWallBlock(x,z,team);
  }
}
function addWallLineZ(x,z1,z2,team,gateHalfWidth=0){
  const step=24;
  const dir=z2>=z1?1:-1;
  for(let z=z1;dir>0?z<=z2:z>=z2;z+=step*dir){
    if(gateHalfWidth&&Math.abs(z-(z1+z2)*.5)<gateHalfWidth)continue;
    addWallBlock(x,z,team);
  }
}
function addBaseObjects(cx,cz,team,color){
  const b1=addBoxObject('building',cx-72,28,cz-45,90,44,70,0,color,135,team);
  const b2=addBoxObject('building',cx+65,24,cz-48,78,36,64,0,color,120,team);
  const command=addBoxObject('building',cx,22,cz+48,76,32,58,0,'#666a63',110,team);
  baseBuildings[team]=[b1,b2,command];
  command.flagTeam=team;
  flagBuildings[team]=command;

  // Proper fortified camp: four walls, with the battlefield-facing wall split
  // by a wide gate aligned to the motor-pool/trapdoor. The opposite wall is
  // solid, while the two side walls keep enemy Jeeps from simply slipping in.
  const hw=158,hd=108,gate=58;
  const frontZ=team===0?cz-hd:cz+hd;
  const backZ=team===0?cz+hd:cz-hd;
  addWallLineZ(cx-hw,cz-hd,cz+hd,team);
  addWallLineZ(cx+hw,cz-hd,cz+hd,team);
  addWallLineX(cx-hw,cx+hw,backZ,team,0);
  addWallLineX(cx-hw,cx+hw,frontZ,team,gate);

  // Four corner towers cover the camp perimeter but leave the central gate
  // unobstructed for the owner. This doubles the old base tower count.
  const tx=hw+18,tz=hd+18;
  addWatchTower(cx-tx,cz-tz,team);
  addWatchTower(cx+tx,cz-tz,team);
  addWatchTower(cx-tx,cz+tz,team);
  addWatchTower(cx+tx,cz+tz,team);
}
function addWatchTower(x,z,team){
  return addObject({kind:'tower',shape:'circle',x,z,r:18,health:90,team,solid:true,range:MAX_FIRE_RANGE,cooldown:1.05,fireInterval:1.65,aim:team===0?0:Math.PI,color:team===0?'#5f744d':'#855047'});
}

function addNeutralWallSegment(x1,z1,x2,z2){
  if(Math.abs(x2-x1)>=Math.abs(z2-z1))addWallLineX(x1,x2,z1,-1,0);
  else addWallLineZ(x1,z1,z2,-1);
}
function addWoodCluster(cluster,index){
  const [cx,cz,cols,rows,spacing]=cluster;
  const ox=(cols-1)*spacing*.5,oz=(rows-1)*spacing*.5;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    // Deliberate gaps stop woods from becoming a solid rectangular wall and
    // create narrow, destructible passages between individual trees.
    const h=terrainHash(index*97+c*31,r*53+index*17);
    if(h<.12)continue;
    const jx=(terrainHash(c+index*13,r+71)-.5)*spacing*.30;
    const jz=(terrainHash(c+91,r+index*19)-.5)*spacing*.30;
    const x=cx-ox+c*spacing+jx,z=cz-oz+r*spacing+jz;
    if(!groundKind(x,z)||Math.hypot(x-trapdoors[0].x,z-trapdoors[0].z)<180||Math.hypot(x-trapdoors[1].x,z-trapdoors[1].z)<180)continue;
    const scale=.82+terrainHash(c*17+index,r*29+5)*.36;
    addCircleObject('tree',x,z,11*scale,30,-1,{scale,yaw:h*Math.PI*2});
  }
}
function addBridgeObjects(){
  bridgeObjects.length=0;
  const bridges=(activeMap.bridges&&activeMap.bridges.length)?activeMap.bridges:[world.bridge];
  for(let bridgeIndex=0;bridgeIndex<bridges.length;bridgeIndex++){
    const br=bridges[bridgeIndex];
    const alongX=br.w>=br.d;
    const length=alongX?br.w:br.d;
    const count=Math.max(3,Math.round(length/95));
    const seg=length/count;
    for(let i=0;i<count;i++)bridgeObjects.push(addObject({
      kind:'bridge',shape:'rect',
      x:alongX?br.x+seg*(i+.5):br.x+br.w*.5,
      z:alongX?br.z+br.d*.5:br.z+seg*(i+.5),
      hx:alongX?seg*.5:br.w*.5,
      hz:alongX?br.d*.5:seg*.5,
      health:82,team:-1,solid:false,
      color:i%2?'#74726b':'#7c7a73',segmentIndex:i,bridgeIndex
    }));
  }
}
function bridgeCrossingBroken(bridgeIndex){return bridgeObjects.some(o=>o.bridgeIndex===bridgeIndex&&!o.alive);}
function allBridgeCrossingsBroken(){
  const bridges=(activeMap.bridges&&activeMap.bridges.length)?activeMap.bridges:[world.bridge];
  return bridges.length>0&&bridges.every((_,i)=>bridgeCrossingBroken(i));
}
function rebuildMapSceneObjects(){

  }
  for(let i=0;i<(activeMap.rocks||[]).length;i++){
    const q=activeMap.rocks[i];addCircleObject('rock',q[0],q[1],q[2],50,-1,{yaw:(i*.47)%1-.25});
  }
  for(let i=0;i<(activeMap.woods||[]).length;i++)addWoodCluster(activeMap.woods[i],i);
  for(const w of activeMap.walls||[])addNeutralWallSegment(w[0],w[1],w[2],w[3]);
  for(const w of activeMap.fortWalls||[]){
    if(Math.abs(w[2]-w[0])>=Math.abs(w[3]-w[1]))addWallLineX(w[0],w[2],w[1],w[4],0);
    else addWallLineZ(w[0],w[1],w[3],w[4],0);
  }
  for(const t of activeMap.towers||[])addWatchTower(t[0],t[1],t[2]);

function chooseCpuRecoveryHeading(){

function approachZero(v,amount){return Math.abs(v)<=amount?0:v-Math.sign(v)*amount;}
function updateHelicopterBank(v,input,dt){
  // Bank follows real lateral cyclic/strafe movement. Positive input is a
  // movement to the aircraft's right, so roll is negative (right side down).
  const target=-clamp(input,-1,1)*.34;
  v.bankAngle+=(target-(v.bankAngle||0))*Math.min(1,dt*8.0);
  if(Math.abs(v.bankAngle)<.001&&Math.abs(target)<.001)v.bankAngle=0;

function updateHelicopterMotion(v,throttle,steer,strafe,dt){
  // Forward speed is persistent as before. Lateral cyclic remains responsive,
  // but its maximum speed is intentionally only about one quarter of v053 so
  // side movement is a fine positioning control rather than a second drive axis.
  if(throttle>0)v.speed=clamp(v.speed+v.accel*dt,-v.maxReverse,v.maxForward);
  else if(throttle<0)v.speed=clamp(v.speed-v.accel*dt,-v.maxReverse,v.maxForward);
  else v.speed=approachZero(v.speed,v.friction*dt);

  const targetStrafe=strafe*(v.maxStrafe||0);
  const lateralResponse=(v.maxStrafe||0)*7.5;
  const lateralRelease=(v.maxStrafe||0)*5.2;
  if(strafe!==0){
    const diff=targetStrafe-(v.strafeSpeed||0);
    const step=Math.min(Math.abs(diff),lateralResponse*dt);
    v.strafeSpeed=(v.strafeSpeed||0)+Math.sign(diff)*step;
  }else v.strafeSpeed=approachZero(v.strafeSpeed||0,lateralRelease*dt);

  v.angle+=steer*v.turnRate*dt;
  const fx=Math.sin(v.angle),fz=Math.cos(v.angle),rx=Math.cos(v.angle),rz=-Math.sin(v.angle);
  const ox=v.x,oz=v.z;
  v.x+=(fx*v.speed+rx*v.strafeSpeed)*dt;
  v.z+=(fz*v.speed+rz*v.strafeSpeed)*dt;
  if(!withinVehicleWorld(v,v.x,v.z,v.radius)){

  // contribution from actual lateral velocity for a natural return to level.
  const velocityBank=v.maxStrafe?clamp((v.strafeSpeed||0)/v.maxStrafe,-1,1):0;

function angleDelta(from,to){return Math.atan2(Math.sin(to-from),Math.cos(to-from));}

function cpuDesiredStrategy(){

  if(cpu.health<cpu.maxHealth*.30&&cpuCanReturnAcrossMap())return 'return';
  if(playerFlag.state==='exposed'||playerFlag.state==='dropped'){
    if(cpu.type==='jeep')return 'capture';
    if(cpuCanReturnAcrossMap())return 'return';

  }

  if(cpuNeedsResupply()&&!depotAvailable(depotForVehicle(cpu))&&cpuCanReturnAcrossMap())return 'return';
  if(allBridgeCrossingsBroken()&&!cpu.airborne&&!cpu.canFloat&&cpuCanReturnAcrossMap())return 'return';

function cpuStrategicGoal(){

  }
  if(cpuAI.state==='capture')return{x:playerFlag.x,z:playerFlag.z};

function distancePointToSegment(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,len2=dx*dx+dz*dz;
  if(len2<1e-6)return Math.hypot(px-ax,pz-az);
  const t=clamp(((px-ax)*dx+(pz-az)*dz)/len2,0,1);
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));
}
function neutralWallBlocksCpuRoute(o){
  if(o.kind!=='wall'||o.team!==-1)return false;
  const wp=cpuAI.path[cpuAI.pathIndex]||cpuStrategicGoal();
  if(!wp)return false;
  const clearance=Math.max(o.hx||12,o.hz||12)+cpu.radius+7;
  return distancePointToSegment(o.x,o.z,cpu.x,cpu.z,wp.x,wp.z)<=clearance;

function cpuCombatTarget(){
  const playerFlag=flags[0];
  if(cpu.carryingFlagTeam!==null||cpuAI.state==='resupply')return null;
  if(player.alive){
    const d=Math.hypot(player.x-cpu.x,player.z-cpu.z);
    if(cpuAI.state==='intercept'&&d<MAX_FIRE_RANGE*.98)return player;
    const limit=(cpuAI.state==='capture'&&cpu.type==='jeep')?190:MAX_FIRE_RANGE*.92;
    if(d<limit)return player;
  }
  if(cpuAI.state==='capture'&&cpu.type==='jeep')return null;
  const command=flagBuildings[0];
  if(cpuAI.state==='attack'&&command&&command.alive){
    const d=Math.hypot(command.x-cpu.x,command.z-cpu.z);
    if(d<MAX_FIRE_RANGE*.90)return command;
  }

  // Deliberate AI fire is reserved for tactically meaningful objects. Trees,
  // palms and rocks remain physical/destructible scenery, but are never chosen
  // as targets merely because they happen to be nearby. They may still be hit
  // by stray shots and blast damage.
  let best=null,bestScore=Infinity;
  for(const o of sceneObjects){
    if(!o.alive||!o.damageable||o.kind==='bridge'||o.team===1)continue;
    const meaningfulEnemy=o.team===0&&(o.kind==='tower'||o.kind==='building'||o.kind==='depot'||o.kind==='wall');
    const blockingNeutralWall=neutralWallBlocksCpuRoute(o);
    if(!meaningfulEnemy&&!blockingNeutralWall)continue;
    const d=Math.hypot(o.x-cpu.x,o.z-cpu.z);
    const limit=meaningfulEnemy?MAX_FIRE_RANGE*.84:190;
    if(d>=limit)continue;
    const priority=o.kind==='tower'?0:o.kind==='building'?18:o.kind==='depot'?26:o.kind==='wall'?42:60;

}
function cpuAimAndFire(dt){

    if(cpu.type==='tank'){
      const d=angleDelta(cpu.turretAngle,0);
      cpu.turretAngle+=clamp(d,-1.6*dt,1.6*dt);
    }
    return;
  }
  const dx=target.x-cpu.x,dz=target.z-cpu.z,range=Math.hypot(dx,dz);
  const desiredWorld=Math.atan2(dx,dz);
  const mode=target.airborne?'air':'ground';

  if(cpu.type==='tank'){
    const desiredRelative=angleDelta(cpu.angle,desiredWorld);
    const d=angleDelta(cpu.turretAngle,desiredRelative);
    cpu.turretAngle+=clamp(d,-2.15*dt,2.15*dt);
    cpu.turretAngle=Math.atan2(Math.sin(cpu.turretAngle),Math.cos(cpu.turretAngle));
    if(Math.abs(d)<.075&&range<MAX_FIRE_RANGE*.96)fire(cpu,1,mode);
    return;
  }

  const facing=Math.abs(angleDelta(cpu.angle,desiredWorld));
  if(facing>.105||range>MAX_FIRE_RANGE*.94)return;

}
function updateCPU(dt){
  cpu.cooldown=Math.max(0,cpu.cooldown-dt);
  cpu.mineCooldown=Math.max(0,cpu.mineCooldown-dt);
  if(pool.mode!=='active'||cpuPool.mode!=='active'||matchWinner!==null||!cpu.alive)return;
  updateCpuMineAwareness();

  // Newly deployed vehicles first clear the hatch in a deterministic straight
  // line. A* takes over only after the vehicle is safely outside the compound.
  if(cpuAI.egress){
    const edx=CPU_EGRESS.x-cpu.x,edz=CPU_EGRESS.z-cpu.z,edist=Math.hypot(edx,edz);
    if(edist<48){
      cpuAI.egress=false;cpuAI.stuckTimer=0;cpuAI.recoverTimer=0;clearCpuPath();
      setCpuState(cpuDesiredStrategy());
    }
  }else setCpuState(cpuDesiredStrategy());

  const goal=cpuAI.egress?CPU_EGRESS:cpuStrategicGoal();
  const target=cpuAI.egress?goal:cpuNavigationTarget(goal,dt);
  let dx=target.x-cpu.x,dz=target.z-cpu.z,dist=Math.hypot(dx,dz);

  if(cpuAI.state==='return'&&Math.hypot(cpu.x-trapdoors[1].x,cpu.z-trapdoors[1].z)<72){
    requestCpuReturn();return;
  }

  let desired=Math.atan2(dx,dz);
  const combat=(cpuAI.egress||cpuAI.state==='resupply'||cpuAI.state==='returnFlag')?null:cpuCombatTarget();
  if(combat&&cpu.type!=='tank'&&cpu.carryingFlagTeam===null){
    const cd=Math.hypot(combat.x-cpu.x,combat.z-cpu.z);
    const directCombatLine=cpu.airborne||navSegmentClear({x:cpu.x,z:cpu.z},{x:combat.x,z:combat.z},cpu);
    if(cd<MAX_FIRE_RANGE*.72&&directCombatLine)desired=Math.atan2(combat.x-cpu.x,combat.z-cpu.z);
  }

  const recovering=cpuAI.recoverTimer>0&&!cpu.airborne;
  if(recovering){
    cpuAI.recoverTimer=Math.max(0,cpuAI.recoverTimer-dt);
    if(cpuAI.recoverTimer>.34)desired=cpu.angle;
    else desired=cpuAI.recoverHeading;
  }
  const ad=angleDelta(cpu.angle,desired);
  cpu.angle+=clamp(ad,-cpu.turnRate*dt,cpu.turnRate*dt);

  const turnPenalty=clamp(1-Math.abs(ad)/1.45,.28,1);
  let desiredSpeed;
  const atResupplyDepot=cpuAI.state==='resupply'&&vehicleInOwnDepot(cpu,-8);
  if(atResupplyDepot){
    desiredSpeed=0;
  }else if(recovering){
    desiredSpeed=cpuAI.recoverTimer>.34?-cpu.maxReverse*.48:cpu.maxForward*.22;
  }else if(cpuAI.egress){
    desiredSpeed=cpu.maxForward*.34*turnPenalty;
  }else{
    const urgent=cpuAI.state==='returnFlag'||cpuAI.state==='intercept';
    desiredSpeed=cpu.maxForward*(urgent?.64:.54)*turnPenalty;
    if(combat&&cpu.type!=='tank'&&cpu.carryingFlagTeam===null&&Math.hypot(combat.x-cpu.x,combat.z-cpu.z)<MAX_FIRE_RANGE*.70)desiredSpeed*=.40;
    if(cpuAI.pathFailed&&!cpu.airborne)desiredSpeed*=.55;
  }
  if(cpu.speed<desiredSpeed)cpu.speed=Math.min(desiredSpeed,cpu.speed+cpu.accel*dt);
  else cpu.speed=Math.max(desiredSpeed,cpu.speed-cpu.brake*.55*dt);

  let roughFactor=cpu.airborne?1:debrisSpeedFactorAt(cpu.x,cpu.z,cpu.radius);
  let waterFactor=1;
  if(cpu.canFloat&&surfaceKindAt(cpu.x,cpu.z)==='water')waterFactor=waterDepthAt(cpu.x,cpu.z)==='deep'?.42:.58;
  const speedFactor=Math.min(roughFactor,waterFactor);
  cpu.speed=clamp(cpu.speed,-cpu.maxReverse*speedFactor,cpu.maxForward*speedFactor);
  const ox=cpu.x,oz=cpu.z;
  cpu.x+=Math.sin(cpu.angle)*cpu.speed*dt;
  cpu.z+=Math.cos(cpu.angle)*cpu.speed*dt;

  const dp=player.alive?Math.hypot(cpu.x-player.x,cpu.z-player.z):Infinity;
  const hitPlayer=vehicleBodiesCollide(cpu,player);
  const hitAlly=cpuReinforcements.some(v=>vehicleBodiesCollide(cpu,v));
  const invalid=cpu.airborne
    ?!withinVehicleWorld(cpu,cpu.x,cpu.z,cpu.radius)
    :(!navPointPassable(cpu.x,cpu.z,cpu,0)||hitPlayer||hitAlly);
  if(invalid){
    cpu.x=ox;cpu.z=oz;
    if(!cpu.airborne){
      cpu.speed=0;
      if(cpuAI.recoverTimer<=0){
        cpuAI.avoidSign*=-1;
        cpuAI.recoverHeading=chooseCpuRecoveryHeading();
      }
      cpuAI.recoverTimer=.72;cpuAI.stuckTimer=0;cpuAI.pathTimer=0;
    }else cpu.speed=0;
  }else if(!cpu.airborne){
    roughFactor=debrisSpeedFactorAt(cpu.x,cpu.z,cpu.radius);
    waterFactor=(cpu.canFloat&&surfaceKindAt(cpu.x,cpu.z)==='water')?(waterDepthAt(cpu.x,cpu.z)==='deep'?.42:.58):1;
    const afterFactor=Math.min(roughFactor,waterFactor);
    cpu.speed=clamp(cpu.speed,-cpu.maxReverse*afterFactor,cpu.maxForward*afterFactor);
    if(surfaceKindAt(cpu.x,cpu.z)==='water'){
      if(cpu.canFloat)cpu.speed*=Math.pow(.72,dt);
      else cpu.speed*=Math.pow(.28,dt);
    }
    if(cpu.canFloat&&fullyInDeepWater(cpu.x,cpu.z,cpu.radius*.72))drown(cpu);
    else if(!cpu.canFloat&&fullyInWater(cpu.x,cpu.z,cpu.radius))drown(cpu);
  }

  const moved=Math.hypot(cpu.x-cpuAI.lastX,cpu.z-cpuAI.lastZ);
  if(!cpu.airborne){
    if(cpuAI.recoverTimer>0)cpuAI.stuckTimer=0;
    else{
      cpuAI.stuckTimer=moved<1.0?cpuAI.stuckTimer+dt:Math.max(0,cpuAI.stuckTimer-dt*2);
      if(cpuAI.stuckTimer>1.0){
        cpuAI.avoidSign*=-1;
        cpuAI.recoverHeading=chooseCpuRecoveryHeading();
        cpuAI.recoverTimer=.72;cpuAI.stuckTimer=0;cpuAI.pathTimer=0;
      }
    }
  }
  cpuAI.lastX=cpu.x;cpuAI.lastZ=cpu.z;

  if(cpu.type==='asv'&&cpu.minesLeft>0&&!isAirVehicle(player)&&player.alive&&cpuAI.state!=='returnFlag'){
    const pd=Math.hypot(player.x-cpu.x,player.z-cpu.z);
    if(pd<145&&cpu.mineCooldown<=0)layMine(cpu);
  }
  cpuAimAndFire(dt);
}

  }
  const command=flagBuildings[0];
  if(command&&command.alive&&Math.hypot(command.x-v.x,command.z-v.z)<MAX_FIRE_RANGE*.88)return command;
  let best=null,bestScore=Infinity;
  for(const o of sceneObjects){
    if(!o.alive||!o.damageable||o.kind==='bridge'||o.team===1)continue;
    if(!(o.team===0&&(o.kind==='tower'||o.kind==='building'||o.kind==='depot'||o.kind==='wall')))continue;
    const d=Math.hypot(o.x-v.x,o.z-v.z);if(d>MAX_FIRE_RANGE*.80)continue;
    const score=d+(o.kind==='tower'?0:o.kind==='building'?18:o.kind==='depot'?28:44);
    if(score<bestScore){best=o;bestScore=score;}
  }

}
function extraAimAndFire(v,dt,target){
  if(!target||!v.alive||v.deployState!=='active')return;
  const dx=target.x-v.x,dz=target.z-v.z,range=Math.hypot(dx,dz),desiredWorld=Math.atan2(dx,dz);
  const mode=target.airborne?'air':'ground';
  if(v.type==='tank'){
    const desiredRelative=angleDelta(v.angle,desiredWorld),d=angleDelta(v.turretAngle,desiredRelative);
    v.turretAngle+=clamp(d,-2.15*dt,2.15*dt);v.turretAngle=Math.atan2(Math.sin(v.turretAngle),Math.cos(v.turretAngle));
    if(Math.abs(d)<.08&&range<MAX_FIRE_RANGE*.95)fire(v,1,mode);return;
  }
  const facing=Math.abs(angleDelta(v.angle,desiredWorld));if(facing>.11||range>MAX_FIRE_RANGE*.93)return;
  if(v.type==='helicopter')v.selectedWeapon=mode==='ground'&&v.ammoSecondary>0?'rocket':'shell';
  fire(v,1,mode);
}
function updateCpuExtraVehicle(v,dt){
  v.cooldown=Math.max(0,v.cooldown-dt);v.mineCooldown=Math.max(0,v.mineCooldown-dt);
  if(!v.alive)return;
  const ai=v.ai;
  if(ai.egress){
    const gx=CPU_EGRESS.x+(v.extraLane||0),gz=CPU_EGRESS.z;
    if(Math.hypot(v.x-gx,v.z-gz)<46){ai.egress=false;ai.path.length=0;ai.pathTimer=0;}
  }
  const strategic=extraStrategicGoal(v);
  const baseGoal=ai.egress?{x:CPU_EGRESS.x+(v.extraLane||0),z:CPU_EGRESS.z}:strategic;
  const target=extraNavigationTarget(v,baseGoal,dt);
  let desired=Math.atan2(target.x-v.x,target.z-v.z);
  const combat=ai.egress?null:extraCombatTarget(v);
  if(combat&&v.type!=='tank'&&v.carryingFlagTeam===null){
    const cd=Math.hypot(combat.x-v.x,combat.z-v.z),clear=v.airborne||navSegmentClear({x:v.x,z:v.z},{x:combat.x,z:combat.z},v);
    if(cd<MAX_FIRE_RANGE*.70&&clear)desired=Math.atan2(combat.x-v.x,combat.z-v.z);
  }
  const ad=angleDelta(v.angle,desired);v.angle+=clamp(ad,-v.turnRate*dt,v.turnRate*dt);
  const turnPenalty=clamp(1-Math.abs(ad)/1.45,.28,1);
  let desiredSpeed=v.maxForward*(ai.egress?.34:.50)*turnPenalty;
  if(combat&&v.type!=='tank'&&Math.hypot(combat.x-v.x,combat.z-v.z)<MAX_FIRE_RANGE*.68)desiredSpeed*=.42;
  if(v.speed<desiredSpeed)v.speed=Math.min(desiredSpeed,v.speed+v.accel*dt);else v.speed=Math.max(desiredSpeed,v.speed-v.brake*.55*dt);
  let rough=v.airborne?1:debrisSpeedFactorAt(v.x,v.z,v.radius),water=1;
  if(v.canFloat&&surfaceKindAt(v.x,v.z)==='water')water=waterDepthAt(v.x,v.z)==='deep'?.42:.58;
  const factor=Math.min(rough,water);v.speed=clamp(v.speed,-v.maxReverse*factor,v.maxForward*factor);
  const ox=v.x,oz=v.z;v.x+=Math.sin(v.angle)*v.speed*dt;v.z+=Math.cos(v.angle)*v.speed*dt;
  const bodyHit=allVehicles().some(o=>o!==v&&o.alive&&vehicleCombatActive(o)&&vehicleBodiesCollide(v,o));
  const invalid=v.airborne?!withinVehicleWorld(v,v.x,v.z,v.radius):(!navPointPassable(v.x,v.z,v,0)||bodyHit);
  if(invalid){v.x=ox;v.z=oz;v.speed=0;ai.pathTimer=0;ai.avoidSign*=-1;v.angle+=ai.avoidSign*.28;}
  else if(!v.airborne){
    if(surfaceKindAt(v.x,v.z)==='water'){if(v.canFloat)v.speed*=Math.pow(.72,dt);else v.speed*=Math.pow(.28,dt);}
    if(v.canFloat&&fullyInDeepWater(v.x,v.z,v.radius*.72))drown(v);else if(!v.canFloat&&fullyInWater(v.x,v.z,v.radius))drown(v);
  }
  if(v.type==='asv'&&v.minesLeft>0&&player.alive&&!isAirVehicle(player)&&Math.hypot(player.x-v.x,player.z-v.z)<145&&v.mineCooldown<=0)layMine(v);
  extraAimAndFire(v,dt,combat);
}
function updateCpuReinforcements(dt){

      const q=clamp((v.deployTimer-.28)/.78,0,1);v.renderYOffset=lerp(v.airborne?-88:-30,0,q);
      if(v.deployTimer>1.12){v.deployState='active';v.renderYOffset=0;v.ai.egress=true;v.extraLane=((i%3)-1)*20;}

function updatePlayer(dt){
  player.cooldown=Math.max(0,player.cooldown-dt);
  player.mineCooldown=Math.max(0,player.mineCooldown-dt);
  if(pool.mode!=='active'||!player.alive||matchWinner!==null)return;

  const turret=gameMode==='single'
    ?(keys.KeyA?1:0)-(keys.KeyD?1:0)
    :(keys.KeyQ?1:0)-(keys.KeyE?1:0);
  if(player.type==='tank'){
    // Single-player uses A/D for the turret; local P1 keeps Q/E.
    // The turret remains relative to the hull, so turning the hull carries it with the tank.
    player.turretAngle+=turret*2.25*dt;
    player.turretAngle=Math.atan2(Math.sin(player.turretAngle),Math.cos(player.turretAngle));
  }

  if(player.airborne){
    // Single-player uses the cursor cluster for primary flight: UP/DOWN speed,
    // LEFT/RIGHT yaw, with A/D reserved for the slow lateral cyclic axis.
    // Local two-player P1 keeps the left-side keyboard layout: W/S speed,
    // A/D yaw, Q/E lateral cyclic.
    const single=gameMode==='single';
    const throttle=single
      ?((keys.ArrowUp||keys.Numpad8)?1:0)-((keys.ArrowDown||keys.Numpad2)?1:0)
      :(keys.KeyW?1:0)-(keys.KeyS?1:0);
    const steer=single
      ?((keys.ArrowLeft||keys.Numpad4)?1:0)-((keys.ArrowRight||keys.Numpad6)?1:0)
      :(keys.KeyA?1:0)-(keys.KeyD?1:0);
    const strafe=single
      ?(keys.KeyD?1:0)-(keys.KeyA?1:0)
      :(keys.KeyQ?1:0)-(keys.KeyE?1:0);
    updateHelicopterMotion(player,throttle,steer,strafe,dt);
    return;
  }

  const single=gameMode==='single';
  const throttle=single
    ?((keys.ArrowUp||keys.Numpad8)?1:0)-((keys.ArrowDown||keys.Numpad2)?1:0)
    :(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const steer=single
    ?((keys.ArrowLeft||keys.Numpad4)?1:0)-((keys.ArrowRight||keys.Numpad6)?1:0)
    :(keys.KeyA?1:0)-(keys.KeyD?1:0);
  if(throttle>0)player.speed+=player.accel*dt;
  else if(throttle<0)player.speed-=player.brake*dt;
  else player.speed=approachZero(player.speed,player.friction*dt);

  let roughFactor=debrisSpeedFactorAt(player.x,player.z,player.radius);
  let waterFactor=1;
  if(player.canFloat&&surfaceKindAt(player.x,player.z)==='water')waterFactor=waterDepthAt(player.x,player.z)==='deep'?.42:.58;
  const speedFactor=Math.min(roughFactor,waterFactor);
  player.speed=clamp(player.speed,-player.maxReverse*speedFactor,player.maxForward*speedFactor);
  const steerGrip=clamp(Math.abs(player.speed)/70,0,1);
  if(steerGrip>.01)player.angle+=steer*player.turnRate*steerGrip*(player.speed>=0?1:-1)*dt;

  const ox=player.x,oz=player.z;
  player.x+=Math.sin(player.angle)*player.speed*dt;
  player.z+=Math.cos(player.angle)*player.speed*dt;
  const hitCpu=enemyVehicles().some(v=>vehicleBodiesCollide(player,v));
  if(!withinVehicleWorld(player,player.x,player.z,player.radius)||hitsObstacle(player.x,player.z,player.radius)||hitCpu){
    player.x=ox;player.z=oz;player.speed*=-.22;
  }else{
    roughFactor=debrisSpeedFactorAt(player.x,player.z,player.radius);
    waterFactor=(player.canFloat&&surfaceKindAt(player.x,player.z)==='water')?(waterDepthAt(player.x,player.z)==='deep'?.42:.58):1;
    const afterFactor=Math.min(roughFactor,waterFactor);
    player.speed=clamp(player.speed,-player.maxReverse*afterFactor,player.maxForward*afterFactor);
    if(surfaceKindAt(player.x,player.z)==='water'){
      if(player.canFloat)player.speed*=Math.pow(.72,dt);
      else player.speed*=Math.pow(.28,dt);
    }
    if(player.canFloat&&fullyInDeepWater(player.x,player.z,player.radius*.72))drown(player);
    else if(!player.canFloat&&fullyInWater(player.x,player.z,player.radius))drown(player);
  }
}

function weaponDirection(v){
  const a=v.type==='tank'?v.angle+v.turretAngle:v.angle;
  return{a,fx:Math.sin(a),fz:Math.cos(a)};
}
function ammoSlotForShot(v){
  if(v.type==='helicopter')return v.selectedWeapon==='rocket'?'ammoSecondary':'ammoPrimary';
  return 'ammoPrimary';
}
function currentAmmo(v){
  const slot=ammoSlotForShot(v);return {slot,value:v[slot]||0,max:slot==='ammoSecondary'?(v.maxAmmoSecondary||0):(v.maxAmmoPrimary||0)};
}
function spendAmmo(v){
  const slot=ammoSlotForShot(v);
  if((v[slot]||0)<=0)return false;
  v[slot]--;return true;
}
function fire(v,team,mode='ground'){
  if(!v.alive||v.cooldown>0)return;
  if(v===player&&pool.mode!=='active')return;
  if(v===cpu&&cpuPool.mode!=='active')return;
  if(v.cpuExtra&&v.deployState!=='active')return;
  const d=weaponDirection(v);

  // Jeep: a real lobbed grenade.  Horizontal range is about one third of
  // the previous v013 grenade range and the projectile can pass over low obstacles.
  if(v.type==='jeep'){
    if(mode!=='ground'||!spendAmmo(v))return;
    playWeaponSound(v,mode);
    v.cooldown=v.fireDelay;
    projectiles.push({
      x:v.x+d.fx*24,y:13,z:v.z+d.fz*24,
      vx:d.fx*128,vy:195,vz:d.fz*128,gravity:-340,groundImpact:true,
      life:2.0,team,damage:v.damage,source:'vehicle',type:'grenade',
      blastRadius:v.blastRadius||42,targetLayer:'ground',clearMines:true
    });
    return;
  }

  // Helicopter keeps the original control idea: one control fires at the
  // ground, another fires forward at airborne targets.  C switches shell/rocket.
  if(v.type==='helicopter'){
    const rocket=v.selectedWeapon==='rocket';
    const type=rocket?'heliRocket':'heliShell';
    const damage=rocket?52:18;
    const blastRadius=rocket?58:0;
    if(!spendAmmo(v))return;
    playWeaponSound(v,mode);
    v.cooldown=rocket?1.00:.36;

    if(mode==='ground'){
      projectiles.push({
        x:v.x+d.fx*24,y:77,z:v.z+d.fz*24,
        vx:d.fx*(rocket?195:216),vy:rocket?-38:-48,vz:d.fz*(rocket?195:216),
        gravity:rocket?-95:-110,groundImpact:true,life:1.5,
        team,damage,source:'vehicle',type,blastRadius,targetLayer:'ground',
        clearMines:rocket
      });
    }else{
      projectiles.push({
        x:v.x+d.fx*34,y:AIR_COMBAT_Y,z:v.z+d.fz*34,
        vx:d.fx*(rocket?470:650),vy:0,vz:d.fz*(rocket?470:650),
        life:rocket?2.1:1.5,team,damage,source:'vehicle',type,
        blastRadius:rocket?42:0,targetLayer:'air'
      });
    }
    return;
  }

  const weapon=mode==='air'?v.airWeapon:v.groundWeapon;
  if(!weapon||!spendAmmo(v))return;
  playWeaponSound(v,mode);
  v.cooldown=v.fireDelay;
  const isRocket=weapon==='rocket'||weapon==='airRocket';

  // Direct-fire rounds start at the physical weapon muzzle.  In particular,
  // Tank X/air fire no longer appears at helicopter altitude above the hull:
  // it leaves the turret barrel and climbs to the airborne combat layer.
  let muzzleDistance=42,muzzleY=13;
  if(v.type==='tank'){muzzleDistance=46;muzzleY=18;}
  else if(v.type==='asv'){muzzleDistance=26;muzzleY=30;}

  projectiles.push({
    x:v.x+d.fx*muzzleDistance,y:muzzleY,z:v.z+d.fz*muzzleDistance,
    vx:d.fx*v.projectileSpeed,vy:0,vz:d.fz*v.projectileSpeed,
    climbToY:mode==='air'?AIR_COMBAT_Y:null,
    climbRate:mode==='air'?155:0,
    life:isRocket?2.4:1.8,team,damage:v.damage,source:'vehicle',type:weapon,
    blastRadius:isRocket?(v.blastRadius||65):0,targetLayer:mode
  });
}
function layMine(v){
  if(!v.alive||v.type!=='asv'||v.mineCooldown>0||v.minesLeft<=0)return;
  if(v===player&&pool.mode!=='active')return;
  if(v===cpu&&cpuPool.mode!=='active')return;
  if(v.cpuExtra&&v.deployState!=='active')return;
  const fx=Math.sin(v.angle),fz=Math.cos(v.angle);
  playMineSound(v);
  mines.push({x:v.x-fx*38,z:v.z-fz*38,team:v.team,r:17,alive:true,armDelay:MINE_ARM_DELAY,armed:false,cpuDetectionEpoch:-1,cpuDetectedEpoch:v.team===1?cpuAI.mineSenseEpoch:-1});
  v.minesLeft--;v.mineCooldown=.75;
}
function blastAt(x,z,damageAmount,radius,team,targetLayer='ground',canDamageBridge=false){
  spawnExplosionBurst(x,8,z,clamp(radius/55,.8,1.6),surfaceKindAt(x,z)==='water');
  if(targetLayer!=='air'){
    for(const o of sceneObjects){
      if(!o.alive||!o.damageable)continue;
      const d=Math.hypot(o.x-x,o.z-z);if(d>radius+(o.r||Math.max(o.hx||0,o.hz||0)))continue;
      const amount=damageAmount*clamp(1-d/(radius*1.35),.28,1);
      damageObject(o,amount,x,z,canDamageBridge);
    }
  }
  for(const v of allVehicles()){
    if(!v.alive||!vehicleCombatActive(v)||v.team===team)continue;
    if(targetLayer==='ground'&&isAirVehicle(v))continue;
    if(targetLayer==='air'&&!isAirVehicle(v))continue;
    const d=Math.hypot(v.x-x,v.z-z);if(d<radius+v.radius)damage(v,damageAmount*clamp(1-d/(radius*1.4),.35,1));
  }
}
function clearMinesNear(x,z,radius){
  for(const m of mines){
    if(!m.alive)continue;
    if(Math.hypot(m.x-x,m.z-z)<=radius){
      m.alive=false;
      spawnExplosionBurst(m.x,3,m.z,.72,false);
    }
  }
}

function damage(v,amount){
  if(!v.alive)return;
  // 999 is used internally for a nominally lethal combat hit. Convert it to
  // one full health bar before applying vulnerability so the handicap remains
  // meaningful for mines, collisions and trapdoor crushes as well as gunfire.
  const baseAmount=amount>=999?v.maxHealth:amount;
  amount=baseAmount*teamVulnerability(v.team);
  v.health=Math.max(0,v.health-amount);
  explosions.push({x:v.x,y:10,z:v.z,t:0,max:.55,big:false});
  if(v.health<=0){v.alive=false;v.speed=0;spawnExplosionBurst(v.x,12,v.z,1.45,false);spawnSmoke(v.x,7,v.z,3.2,1.25);}
}

function fireTower(t,target){
  const dx=target.x-t.x,dz=target.z-t.z,d=Math.hypot(dx,dz)||1;
  const lead=clamp(d/360,0,.9);
  const tx=target.x+Math.sin(target.angle)*target.speed*lead;
  const tz=target.z+Math.cos(target.angle)*target.speed*lead;
  const ax=tx-t.x,az=tz-t.z,ad=Math.hypot(ax,az)||1;
  t.aim=Math.atan2(ax,az);
  playTowerSound(t);
  projectiles.push({x:t.x+ax/ad*22,y:27,z:t.z+az/ad*22,vx:ax/ad*365,vy:0,vz:az/ad*365,life:1.7,team:t.team,damage:9,source:'tower'});
  t.cooldown=t.fireInterval||1.65;
}
function updateTowers(dt){
  for(const t of sceneObjects){
    if(t.kind!=='tower'||!t.alive)continue;
    t.cooldown=Math.max(0,t.cooldown-dt);
    let target=null,best=Infinity;
    for(const v of allVehicles()){
      if(!v.alive||!vehicleCombatActive(v)||v.team===t.team)continue;
      const d=Math.hypot(v.x-t.x,v.z-t.z);
      if(d<t.range&&d<best){best=d;target=v;}
    }
    if(!target)continue;
    t.aim=Math.atan2(target.x-t.x,target.z-t.z);
    if(t.cooldown<=0)fireTower(t,target);
  }
}

function updateMines(dt){
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];if(!m.alive){mines.splice(i,1);continue;}

    // Newly laid mines are inert for a short moment so the deploying ASV can
    // clear them. Once armed they are deliberately indiscriminate: friendly
    // ground vehicles trigger them just as enemy ground vehicles do.
    m.armDelay=Math.max(0,(m.armDelay??0)-dt);
    m.armed=m.armDelay<=0;
    if(!m.armed)continue;

    for(const v of allVehicles()){
      if(!v.alive||!vehicleCombatActive(v)||isAirVehicle(v))continue;
      const d=Math.hypot(v.x-m.x,v.z-m.z);
      if(d<m.r+v.radius*.72){
        spawnExplosionBurst(m.x,5,m.z,1.35,false);
        // A mine is lethal to any ground vehicle in the immediate blast area,
        // not only to the vehicle that happened to trip the proximity check.
        for(const hit of allVehicles()){
          if(!hit.alive||!vehicleCombatActive(hit)||isAirVehicle(hit))continue;
          if(Math.hypot(hit.x-m.x,hit.z-m.z)<m.r+hit.radius+16)damage(hit,999);
        }
        m.alive=false;break;
      }
    }
    if(!m.alive)mines.splice(i,1);
  }
}
function isHelicopterProjectile(p){
  return p.type==='heliShell'||p.type==='heliRocket';
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.startX===undefined){p.startX=p.x;p.startZ=p.z;}

    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.gravity)p.vy+=p.gravity*dt;
    // Air-target rounds fired by ground vehicles rise from their real launcher
    // position, then level off at helicopter fuselage height.
    if(p.climbToY!==null&&p.climbToY!==undefined&&p.y<p.climbToY){
      p.y=Math.min(p.climbToY,p.y+(p.climbRate||155)*dt);
    }
    p.life-=dt;

    // Hard horizontal range limit shared with the watchtowers. Clamp the last
    // step to the boundary so even a fast shell cannot visibly overshoot it.
    let rangeExpired=false;
    const range=Math.hypot(p.x-p.startX,p.z-p.startZ);
    if(range>MAX_FIRE_RANGE){
      const s=MAX_FIRE_RANGE/range;
      p.x=p.startX+(p.x-p.startX)*s;
      p.z=p.startZ+(p.z-p.startZ)*s;
      rangeExpired=true;
    }

    let remove=rangeExpired||p.life<=0||p.x<OUTER_MIN_X||p.z<OUTER_MIN_Z||p.x>OUTER_MAX_X||p.z>OUTER_MAX_Z;
    let detonate=remove&&p.blastRadius>0;
    let groundImpact=false;

    // Lobbed grenades and helicopter ground fire resolve only when they meet
    // the terrain, so they can visibly arc over walls and other low scenery.
    if(!remove&&p.groundImpact){
      // Descending helicopter/grenade rounds can now strike the actual 3D
      // volume of a wall, tower, building, rock, palm or bridge section.
      // Previously they only tested objects after reaching terrain height,
      // which made visually obvious hits pass through roofs and towers.
      const objectHit=findGroundProjectileObjectAt(p.x,p.y,p.z);
      if(objectHit){
        groundImpact=true;remove=true;
        if(p.blastRadius>0)detonate=true;
        else damageObject(objectHit,p.damage,p.x,p.z,isHelicopterProjectile(p));
      }else{
        const gy=surfaceKindAt(p.x,p.z)==='water'?-7.4:.65;
        if(p.y<=gy){
          p.y=gy+1;groundImpact=true;remove=true;
          const heliShot=isHelicopterProjectile(p);
          const bridgeHit=bridgeSegmentAt(p.x,p.z);
          if(p.blastRadius>0)detonate=true;
          else{
            const hit=findDamageableObjectAt(p.x,p.z,null);
            if(hit)damageObject(hit,p.damage,p.x,p.z,heliShot);
            // Vehicles have priority over the terrain beneath them.  This is
            // especially important on bridges: the deck must never shield a
            // tank/Jeep/ASV from an otherwise valid hit.
            let vehicleHit=false;
            for(const v of allVehicles()){
              if(!v.alive||!vehicleCombatActive(v)||v.team===p.team||isAirVehicle(v))continue;
              if(Math.hypot(v.x-p.x,v.z-p.z)<v.radius+18){damage(v,p.damage);vehicleHit=true;}
            }
            // Only helicopter ground fire can damage an intact bridge section,
            // and only when no vehicle/object absorbed the direct shell.
            if(!vehicleHit&&!hit&&heliShot&&bridgeHit)damageObject(bridgeHit,p.damage,p.x,p.z,true);
          }
        }
      }
    }

    if(!remove&&!p.groundImpact&&p.targetLayer!=='air'){
      const hit=findDamageableObjectAt(p.x,p.z,p.source==='tower'?p.team:null);
      if(hit){
        if(p.blastRadius>0)detonate=true;
        else damageObject(hit,p.damage,p.x,p.z,isHelicopterProjectile(p));
        remove=true;
      }
    }

    if(!remove&&!p.groundImpact){
      for(const v of allVehicles()){
        if(!v.alive||!vehicleCombatActive(v)||v.team===p.team)continue;
        if(p.targetLayer==='ground'&&isAirVehicle(v))continue;
        if(p.targetLayer==='air'&&!isAirVehicle(v))continue;
        const dx=p.x-v.x,dz=p.z-v.z;
        if(dx*dx+dz*dz<v.radius*v.radius){
          if(p.blastRadius>0)detonate=true;else damage(v,p.damage);
          remove=true;break;
        }
      }
    }

    if(detonate){
      blastAt(p.x,p.z,p.damage,p.blastRadius,p.team,p.targetLayer||'ground',isHelicopterProjectile(p));
      if(p.clearMines)clearMinesNear(p.x,p.z,p.blastRadius+22);
    }else if(groundImpact&&p.clearMines){
      clearMinesNear(p.x,p.z,34);
    }
    if(remove)projectiles.splice(i,1);
  }
  // Remove mines destroyed by helicopter rockets.
  for(let i=mines.length-1;i>=0;i--)if(!mines[i].alive)mines.splice(i,1);
  for(let i=explosions.length-1;i>=0;i--){explosions[i].t+=dt;if(explosions[i].t>explosions[i].max)explosions.splice(i,1);}
  for(let i=smokeEffects.length-1;i>=0;i--){smokeEffects[i].t+=dt;if(smokeEffects[i].t>smokeEffects[i].max)smokeEffects.splice(i,1);}
}

function updateCameraFor(cam,v,dt,snap){
  // Each human player gets an independent fixed-world camera. In local two-player
  // mode this function is run once for P1 and once for P2; neither camera reacts
  // to the other player's position.
  const fx=Math.sin(v.angle),fz=Math.cos(v.angle);
  let desiredX=v.x+fx*65,desiredZ=v.z+fz*65;
  if(isAirVehicle(v)||v.canFloat){
    desiredX=clamp(desiredX,OUTER_MIN_X+150,OUTER_MAX_X-150);
    desiredZ=clamp(desiredZ,OUTER_MIN_Z+150,OUTER_MAX_Z-150);
  }else{
    // Preserve the Classic camera edge margins, but derive the far limits from
    // the currently selected battlefield. Hard-coding 2080/1460 traps cameras
    // inside the old 2400x1700 map when larger maps are selected.
    const minCamX=MAP_ORIGIN_X+240;
    const maxCamX=Math.max(minCamX,world.width-320);
    const minCamZ=MAP_ORIGIN_Z+160;
    const maxCamZ=Math.max(minCamZ,world.depth-240);
    desiredX=clamp(desiredX,minCamX,maxCamX);
    desiredZ=clamp(desiredZ,minCamZ,maxCamZ);
  }
  const follow=snap?1:(1-Math.exp(-2.25*Math.max(0,dt)));
  cam.focusX=lerp(cam.focusX,desiredX,follow);cam.focusZ=lerp(cam.focusZ,desiredZ,follow);
  if(gameMode==='local2'){
    cam.x=cam.focusX-145;cam.y=440;cam.z=cam.focusZ+515;
    cam.tx=cam.focusX+10;cam.ty=0;cam.tz=cam.focusZ-40;
  }else{
    cam.x=cam.focusX-255;cam.y=760;cam.z=cam.focusZ+885;
    cam.tx=cam.focusX+20;cam.ty=0;cam.tz=cam.focusZ-55;
  }
  cam.forward=norm3({x:cam.tx-cam.x,y:cam.ty-cam.y,z:cam.tz-cam.z});
  cam.right=norm3(cross3(cam.forward,{x:0,y:1,z:0}));
  cam.up=norm3(cross3(cam.right,cam.forward));
}
function updateCameras(dt,snap){
  updateCameraFor(cameraP1,player,dt,snap);
  if(gameMode==='local2')updateCameraFor(cameraP2,cpu,dt,snap);
  camera=cameraP1;
}
function toCam(p){
  const r={x:p.x-camera.x,y:p.y-camera.y,z:p.z-camera.z};
  return{x:dot3(r,camera.right),y:dot3(r,camera.up),z:dot3(r,camera.forward)};
}
function clipNear(vs){
  const out=[];
  for(let i=0;i<vs.length;i++){
    const a=vs[(i+vs.length-1)%vs.length],b=vs[i];
    const ina=a.z>=NEAR,inb=b.z>=NEAR;
    if(ina!==inb){const t=(NEAR-a.z)/(b.z-a.z);out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR});}
    if(inb)out.push(b);
  }
  return out;
}
function projectCam(v){return{x:W*.5+v.x*FOCAL/v.z,y:VIEW_H*.47-v.y*FOCAL/v.z};}
function shadeRGB(hex,f){
  const n=parseInt(hex.slice(1),16);
  return [
    clamp(Math.round(((n>>16)&255)*f),0,255),
    clamp(Math.round(((n>>8)&255)*f),0,255),
    clamp(Math.round((n&255)*f),0,255)
  ];
}
function healthColor(o,base){
  if(!o||!o.maxHealth||o.health>=o.maxHealth)return base;
  const ratio=clamp(o.health/o.maxHealth,0,1);
  // Damage is intentionally readable at the low game resolution: surviving
  // objects become progressively darker and slightly browner/sootier.
  const n=parseInt(base.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=.58+.42*ratio;
  const soot=(1-ratio)*18;
  const rr=clamp(Math.round(r*f+soot),0,255);
  const gg=clamp(Math.round(g*f+soot*.55),0,255);
  const bb=clamp(Math.round(b*f+soot*.32),0,255);
  return '#'+rr.toString(16).padStart(2,'0')+gg.toString(16).padStart(2,'0')+bb.toString(16).padStart(2,'0');
}
const light=norm3({x:-.4,y:.9,z:-.25});

function submitPoly(worldVerts,color,twoSided){
  if(worldVerts.length<3)return;

  let brightness=1;
  if(!twoSided){
    const a=worldVerts[0],b=worldVerts[1],c=worldVerts[2];
    let n=norm3(cross3(sub3(b,a),sub3(c,a)));
    const ctr=avg3(a,b,c),toEye={x:camera.x-ctr.x,y:camera.y-ctr.y,z:camera.z-ctr.z};
    // Do not discard back faces.  Incorrect/mixed winding in small hand-built
    // meshes must never make geometry vanish; instead orient the normal toward
    // the camera for stable flat shading.
    if(dot3(n,toEye)<0)n={x:-n.x,y:-n.y,z:-n.z};
    brightness=.60+.42*Math.max(0,dot3(n,light));
  }

  let cv=clipNear(worldVerts.map(toCam));
  if(cv.length<3)return;
  const rgb=shadeRGB(color,brightness);

  // Triangulate the clipped polygon.  Visibility is resolved later by the
  // per-pixel Z buffer, not by painter sorting.
  for(let i=1;i<cv.length-1;i++){
    const a=cv[0],b=cv[i],c=cv[i+1];
    const pa=projectCam(a),pb=projectCam(b),pc=projectCam(c);
    triangles.push({
      a:{x:pa.x,y:pa.y,iz:1/a.z},
      b:{x:pb.x,y:pb.y,iz:1/b.z},
      c:{x:pc.x,y:pc.y,iz:1/c.z},
      rgb
    });
  }
}

function rotPoint(cx,cy,cz,lx,ly,lz,yaw){
  const c=Math.cos(yaw),s=Math.sin(yaw);
  return{x:cx+lx*c+lz*s,y:cy+ly,z:cz-lx*s+lz*c};
}
function addBox(cx,cy,cz,sx,sy,sz,yaw,color){
  const x=sx/2,y=sy/2,z=sz/2;
  const lv=[[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[-x,y,-z],[x,y,-z],[x,y,z],[-x,y,z]];
  const v=lv.map(q=>rotPoint(cx,cy,cz,q[0],q[1],q[2],yaw));
  const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
  for(const f of faces)submitPoly(f.map(i=>v[i]),color,false);
}
function aircraftPoint(cx,cy,cz,lx,ly,lz,yaw,roll){
  // Roll around the vehicle's local forward axis first, then yaw into world space.
  const cr=Math.cos(roll),sr=Math.sin(roll);
  const bx=lx*cr-ly*sr,by=lx*sr+ly*cr,bz=lz;
  const c=Math.cos(yaw),s=Math.sin(yaw);
  return{x:cx+bx*c+bz*s,y:cy+by,z:cz-bx*s+bz*c};
}
function addAircraftBox(cx,cy,cz,ox,oy,oz,sx,sy,sz,yaw,roll,localYaw,color){
  const x=sx/2,y=sy/2,z=sz/2,c=Math.cos(localYaw||0),sn=Math.sin(localYaw||0);
  const lv=[[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[-x,y,-z],[x,y,-z],[x,y,z],[-x,y,z]];
  const v=lv.map(q=>{
    const qx=q[0]*c+q[2]*sn,qz=-q[0]*sn+q[2]*c;
    return aircraftPoint(cx,cy,cz,ox+qx,oy+q[1],oz+qz,yaw,roll);
  });
  const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
  for(const f of faces)submitPoly(f.map(i=>v[i]),color,false);
}
function addGroundDisc(cx,cz,rx,rz,y,color,n){
  n=n||12;const c={x:cx,y,z:cz};
  for(let i=0;i<n;i++){
    const a=i*Math.PI*2/n,b=(i+1)*Math.PI*2/n;
    submitPoly([c,{x:cx+Math.cos(a)*rx,y,z:cz+Math.sin(a)*rz},{x:cx+Math.cos(b)*rx,y,z:cz+Math.sin(b)*rz}],color,true);
  }
}
function addStrip(x1,z1,x2,z2,width,y,color){
  const dx=x2-x1,dz=z2-z1,l=Math.hypot(dx,dz)||1,nx=-dz/l*width*.5,nz=dx/l*width*.5;
  submitPoly([{x:x1+nx,y,z:z1+nz},{x:x2+nx,y,z:z2+nz},{x:x2-nx,y,z:z2-nz},{x:x1-nx,y,z:z1-nz}],color,true);
}
function addAmmoDepot(d){
  // The refill area is a low, non-solid apron in front of the building.

  addBox(x,1.25,z,94,2.5,68,0,live?'#50524d':'#444540');
  addBox(x-44,2.1,z,5,1.8,68,0,d.team===0?'#75885a':'#91584e');
  addBox(x+44,2.1,z,5,1.8,68,0,d.team===0?'#75885a':'#91584e');
  // Two ammunition-crate markers at the rear corners of the pad.
  addBox(x-30,5,z-d.frontSign*22,20,7,17,.06,live?d.color:'#4d4b43');
  addBox(x+30,5,z-d.frontSign*22,20,7,17,-.06,live?d.color:'#4d4b43');

function addPalm(x,z,s,damageRatio=1){
  const fake={health:damageRatio,maxHealth:1};
  addBox(x,13*s,z,5*s,26*s,5*s,.12,healthColor(fake,'#6f5132'));
  const y=28*s,green=healthColor(fake,'#4d6538');

function addTree(x,z,s,damageRatio=1,yaw=0){

function addTower(o){

function addRubble(o){

  for(let i=0;i<c;i++){
    const a=i*2.17+(o.id||0)*.41;
    const dx=Math.cos(a)*sx*.22,dz=Math.sin(a)*sz*.22;
    addBox(o.x+dx,3.2+(i%2),o.z+dz,Math.max(5,sx*.18),5+(i%2)*2,Math.max(5,sz*.16),a,'#56544b');

function renderSceneObjects(){
  for(const o of sceneObjects){
    if(!o.alive){addRubble(o);continue;}
    switch(o.kind){
      case 'building':
        addBox(o.x,o.y,o.z,o.sx,o.sy,o.sz,o.yaw,healthColor(o,o.color));break;
      case 'depot': {
        const d=o.depot,body=healthColor(o,o.color),front=d?d.frontSign:1;
        addBox(o.x,o.y,o.z,o.sx,o.sy,o.sz,o.yaw,body);
        addBox(o.x,o.y+o.sy*.5+2,o.z,o.sx+6,4,o.sz+6,0,healthColor(o,'#555951'));
        // Dark service door and small AMMO canopy face the refill apron.
        addBox(o.x,11,o.z+front*(o.sz*.5+1),26,22,3,0,'#292d2a');
        addBox(o.x,24,o.z+front*(o.sz*.5+5),38,5,9,0,healthColor(o,d?d.color:o.color));
        break;
      }
      case 'wall': {
        // A compact stone block with a slightly wider cap makes individual
        // wall units legible, similar to classic RTS wall segments.
        const body=healthColor(o,o.color);
        addBox(o.x,o.y-2,o.z,o.sx,o.sy-4,o.sz,o.yaw,body);
        addBox(o.x,o.y+o.sy*.5-2.5,o.z,o.sx+4,5,o.sz+4,o.yaw,healthColor(o,'#777970'));
        break;
      }
      case 'palm':
        addPalm(o.x,o.z,o.scale,o.health/o.maxHealth);break;
      case 'tree':
        addTree(o.x,o.z,o.scale,o.health/o.maxHealth,o.yaw||0);break;
      case 'rock':
        addBox(o.x,8,o.z,o.r*1.6,16,o.r*1.35,o.yaw||0,healthColor(o,'#746c5e'));break;
      case 'tower':
        addTower(o);break;
      case 'bridge': {
        const by=.14,x1=o.x-o.hx,x2=o.x+o.hx,z1=o.z-o.hz,z2=o.z+o.hz;
        submitPoly([{x:x1,y:by,z:z1},{x:x2,y:by,z:z1},{x:x2,y:by,z:z2},{x:x1,y:by,z:z2}],healthColor(o,o.color),true);
        // Slightly raised dark seam makes the individual destructible sections legible.
        if(o.segmentIndex>0)submitPoly([{x:x1,y:by+.025,z:z1},{x:x2,y:by+.025,z:z1},{x:x2,y:by+.025,z:z1+2},{x:x1,y:by+.025,z:z1+2}],'#4f4e49',true);
        break;
      }
    }
  }
}
function addVehicleShadow(v,rx,rz){

  const fx=Math.sin(v.angle),fz=Math.cos(v.angle),rightX=Math.cos(v.angle),rightZ=-Math.sin(v.angle);

    {x:v.x+rightX*rx+fx*rz,y:sy,z:v.z+rightZ*rx+fz*rz},

    {x:v.x-rightX*rx-fx*rz,y:sy,z:v.z-rightZ*rx-fz*rz},

function helicopterShadowColorAt(x,z){

function addHelicopterShadow(v){

function addTank(v,selected){

function addProjectileShadow(p){

  const groundY=surfaceKindAt(p.x,p.z)==='water'?-7.4:.65;
  const altitude=Math.max(0,p.y-groundY);
  const sx=p.x+altitude*.38,sz=p.z+altitude*.27;
  const sy=shadowYAt(sx,sz)+.055;
  const speed=Math.hypot(p.vx||0,p.vz||0);
  const a=speed>1?Math.atan2(p.vx,p.vz):0,fx=Math.sin(a),fz=Math.cos(a);
  const size=p.type==='grenade'?5.5:6.5;

  if(speed>1)addStrip(sx-fx*length,sz-fz*length,sx+fx*length,sz+fz*length,size*.78,sy+.007,'#20211d');

function addProjectile(p){

  addProjectileShadow(p);

  const a=Math.atan2(p.vx||0,p.vz||1),fx=Math.sin(a),fz=Math.cos(a);

    addBox(p.x-fx*8,p.y,p.z-fz*8,3.8,3.8,16,a,trail);

function addExplosion(e){

  const q=clamp(e.t/e.max,0,1),size=e.size||1;

  addBox(e.x,y,e.z,r,r,r,q*.4,color);
}
function addSmoke(s){
  const q=clamp(s.t/s.max,0,1);
  if(q>=1)return;
  const scale=s.scale||1;
  // Three coarse puffs drift upward and apart.  There is intentionally no
  // persistent smoke state: the entire plume expires after s.max seconds.
  for(let i=0;i<3;i++){
    const phase=clamp(q*1.45-i*.18,0,1);
    if(phase<=0)continue;
    const a=s.seed+i*2.1;
    const drift=10+phase*18;
    const x=s.x+Math.sin(a)*drift*phase;
    const z=s.z+Math.cos(a*.83)*drift*.55*phase;
    const y=s.y+8+i*11+phase*42;
    const r=(10+i*3+phase*12)*scale*(1-q*.45);
    const color=q<.45?'#55534d':q<.75?'#62605a':'#74716a';
    addBox(x,y,z,r,r*.82,r,phase*.25,color);
  }
}

function pointSegDist(px,pz,x1,z1,x2,z2){
  const vx=x2-x1,vz=z2-z1,wx=px-x1,wz=pz-z1;
  const vv=vx*vx+vz*vz||1;
  const t=clamp((wx*vx+wz*vz)/vv,0,1);
  return Math.hypot(px-(x1+vx*t),pz-(z1+vz*t));
}
function ellipse(x,z,cx,cz,rx,rz){
  const dx=(x-cx)/rx,dz=(z-cz)/rz;
  return dx*dx+dz*dz<=1;
}
function rectInside(x,z,r){return Math.abs(x-r[0])<=r[2]&&Math.abs(z-r[1])<=r[3];}
function islandInside(x,z){
  for(const e of activeMap.land||[])if(ellipse(x,z,e[0],e[1],e[2],e[3]))return true;
  for(const r of activeMap.landRects||[])if(rectInside(x,z,r))return true;
  return false;
}
function lakeInside(x,z){
  for(const e of activeMap.lakes||[])if(ellipse(x,z,e[0],e[1],e[2],e[3]))return true;
  for(const r of activeMap.waterRects||[])if(rectInside(x,z,r))return true;
  return false;
}
let roadSegments=activeMap.roads;
function groundKind(x,z){
  if(!islandInside(x,z)||lakeInside(x,z))return null;
  for(const r of roadSegments)if(pointSegDist(x,z,r[0],r[1],r[2],r[3])<52)return 'road';
  for(const e of activeMap.grass||[])if(ellipse(x,z,e[0],e[1],e[2],e[3]))return 'grass';
  return 'sand';
}
function terrainHash(x,z){
  // Stable integer hash: terrain texture never shimmers or changes between frames.
  let n=(Math.imul((x|0),374761393)+Math.imul((z|0),668265263))|0;
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}
function terrainNoiseColor(base,x,z,amount){
  const f=1+(terrainHash(x,z)-.5)*2*amount;
  const rgb=shadeRGB(base,f);
  return '#'+rgb[0].toString(16).padStart(2,'0')+rgb[1].toString(16).padStart(2,'0')+rgb[2].toString(16).padStart(2,'0');
}
function addTerrainMesh(){
  // Ground remains mutually exclusive, but sand/grass cells are split into four
  // low-contrast patches.  This is geometry-level "texture" rather than a
  // bitmap, keeping the whole game self-contained and avoiding coplanar decals.
  const step=MAP_BLOCK,sub=step*.5;
  const colors={sand:'#b39a67',grass:'#727b51',road:'#777469'};
  for(let z=80;z<world.depth-80;z+=step){
    for(let x=80;x<world.width-80;x+=step){
      const x2=Math.min(x+step,world.width-80),z2=Math.min(z+step,world.depth-80);
      const q=terrainBlockCoords(x+.1,z+.1),kind=terrainBlockKind(q.c,q.r);
      if(!kind)continue;
      const y=.12;
      if(kind==='sand'||kind==='grass'){
        const noise=kind==='sand'?.0325:.0425;
        for(let zz=z;zz<z2;zz+=sub){
          for(let xx=x;xx<x2;xx+=sub){
            const xx2=Math.min(xx+sub,x2),zz2=Math.min(zz+sub,z2);
            const color=terrainNoiseColor(colors[kind],Math.round(xx/sub),Math.round(zz/sub),noise);
            submitPoly([{x:xx,y,z:zz},{x:xx2,y,z:zz},{x:xx2,y,z:zz2},{x:xx,y,z:zz2}],color,true);
          }
        }
      }else{
        submitPoly([{x,y,z},{x:x2,y,z},{x:x2,y,z:z2},{x,y,z:z2}],colors[kind],true);
      }
    }
  }
}

function edge(ax,ay,bx,by,px,py){return (px-ax)*(by-ay)-(py-ay)*(bx-ax);}
function rasterTriangle(t){
  const a=t.a,b=t.b,c=t.c;
  let area=edge(a.x,a.y,b.x,b.y,c.x,c.y);
  if(Math.abs(area)<1e-6)return;
  const minX=clamp(Math.floor(Math.min(a.x,b.x,c.x)),0,W-1);
  const maxX=clamp(Math.ceil(Math.max(a.x,b.x,c.x)),0,W-1);
  const minY=clamp(Math.floor(Math.min(a.y,b.y,c.y)),0,VIEW_H-1);
  const maxY=clamp(Math.ceil(Math.max(a.y,b.y,c.y)),0,VIEW_H-1);
  if(maxX<minX||maxY<minY)return;
  const invArea=1/area;
  const positive=area>0;
  const r=t.rgb[0],g=t.rgb[1],bl=t.rgb[2];
  for(let y=minY;y<=maxY;y++){
    const py=y+.5;
    for(let x=minX;x<=maxX;x++){
      const px=x+.5;
      const e0=edge(b.x,b.y,c.x,c.y,px,py);
      const e1=edge(c.x,c.y,a.x,a.y,px,py);
      const e2=edge(a.x,a.y,b.x,b.y,px,py);
      if(positive ? (e0<0||e1<0||e2<0) : (e0>0||e1>0||e2>0))continue;
      const w0=e0*invArea,w1=e1*invArea,w2=e2*invArea;
      const iz=w0*a.iz+w1*b.iz+w2*c.iz;
      if(iz<=0)continue;
      // Reciprocal camera-space Z is linear after projection.  Reconstructing
      // Z here and storing nearest depth makes the comparison explicit and,
      // with Float64 storage, avoids the tiny precision losses seen in v004.
      const depth=1/iz;
      const idx=y*W+x;
      if(depth>=zbuf[idx]-1e-7)continue;
      zbuf[idx]=depth;
      const p=idx*4;pixels[p]=r;pixels[p+1]=g;pixels[p+2]=bl;pixels[p+3]=255;
    }
  }
}
function rasterize(xOffset=0,yOffset=0){
  zbuf.fill(Infinity);
  // Sky/background.  Filling the small 480x237 framebuffer explicitly keeps
  // the whole 3D pass deterministic and independent of Canvas draw ordering.
  for(let i=0;i<W*VIEW_H;i++){
    const p=i*4;pixels[p]=49;pixels[p+1]=94;pixels[p+2]=104;pixels[p+3]=255;
  }
  for(const t of triangles)rasterTriangle(t);
  ctx.putImageData(frame,xOffset,yOffset);
}
