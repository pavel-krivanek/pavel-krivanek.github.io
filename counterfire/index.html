function drawControlTable(x,y,w,h){
  // One matrix makes mode differences directly comparable: operations are rows,
  // while each playable control scheme owns a fixed column.
  const rows=[
    ['MOVE / SPEED',       'UP / DOWN',      'W / S',          'UP / DOWN'],
    ['STEER / YAW',        'LEFT / RIGHT',   'A / D',          'LEFT / RIGHT'],
    ['TANK TURRET',        'A / D',          'Q / E',          ', / .'],
    ['HELI STRAFE',        'A / D',          'Q / E',          ', / .'],
    ['GROUND FIRE',        'SPACE',          'LCTRL',          'RCTRL'],
    ['AIR FIRE',           'LSHIFT / X',     'LSHIFT',         'RSHIFT'],
    ['HELI WEAPON',        'C',              'C',              "'"],
    ['LAY MINE',           'S',              'Z',              ';'],
    ['MOTOR POOL',         'ENTER',          'TAB',            'BACKSPACE'],
    ['POOL SELECT',        'UP / DOWN',      'W / S',          'UP / DOWN'],
    ['DEPLOY',             'SPACE',          'LCTRL',          'RCTRL']
  ];
  const headers=['OPERATION','SINGLE PLAYER','PLAYER 1','PLAYER 2'];
  const opW=Math.min(142,Math.max(116,Math.round(w*.29)));
  const playerW=(w-opW)/3;
  const cols=[x,x+opW,x+opW+playerW,x+opW+playerW*2,x+w];
  const headerH=20;
  const rowH=Math.max(12,Math.min(20,(h-headerH)/rows.length));
  const usedH=headerH+rowH*rows.length;

  ctx.fillStyle='rgba(18,22,20,.95)';ctx.fillRect(x,y,w,usedH);
  ctx.strokeStyle='#6d746b';ctx.strokeRect(x+.5,y+.5,w-1,usedH-1);

  // Header band.
  ctx.fillStyle='#303731';ctx.fillRect(x+1,y+1,w-2,headerH-1);
  ctx.textBaseline='middle';ctx.textAlign='center';ctx.font='bold 9px monospace';
  for(let c=0;c<4;c++){
    ctx.fillStyle=c===0?'#d6d09f':c===1?'#d6d09f':c===2?'#c8d07c':'#e3a18f';
    ctx.fillText(headers[c],(cols[c]+cols[c+1])/2,y+headerH*.52);
  }

  const fontSize=rowH>=17?10:9;
  for(let r=0;r<rows.length;r++){
    const ry=y+headerH+r*rowH;
    ctx.fillStyle=r%2?'rgba(33,38,34,.94)':'rgba(39,44,40,.94)';
    ctx.fillRect(x+1,ry,w-2,rowH);
    ctx.strokeStyle='#4d544d';ctx.beginPath();ctx.moveTo(x,ry+.5);ctx.lineTo(x+w,ry+.5);ctx.stroke();

    ctx.font=`${fontSize}px monospace`;ctx.textBaseline='middle';
    for(let c=0;c<4;c++){
      const cx0=cols[c],cx1=cols[c+1];
      ctx.textAlign=c===0?'left':'center';
      ctx.fillStyle=c===0?'#aaa98f':c===1?'#d6d09f':c===2?'#c8d07c':'#e3a18f';
      ctx.fillText(rows[r][c],c===0?cx0+8:(cx0+cx1)/2,ry+rowH*.52);
    }
  }

  // Strong vertical separators keep every key visually attached to its header.
  ctx.strokeStyle='#697168';
  for(let c=1;c<4;c++){
    ctx.beginPath();ctx.moveTo(cols[c]+.5,y);ctx.lineTo(cols[c]+.5,y+usedH);ctx.stroke();
  }
  ctx.textAlign='left';ctx.textBaseline='top';
}
function drawModeSelection(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.textBaseline='top';
  const margin=8,gap=7;

  // Compact setup panel: battlefield on the left and independent per-side
  // handicaps on the right, plus CPU simultaneous-force pressure on KEY 7.
  const mainW=Math.min(470,W-margin*2),mainH=128;
  const mainX=Math.round((W-mainW)/2),mainY=8;
  ctx.fillStyle='rgba(18,22,20,.96)';ctx.fillRect(mainX,mainY,mainW,mainH);
  ctx.strokeStyle='#777b70';ctx.strokeRect(mainX+.5,mainY+.5,mainW-1,mainH-1);

  ctx.fillStyle='#ddd7aa';ctx.font='bold 14px monospace';
  const title='COUNTERFIRE';ctx.fillText(title,mainX+Math.round((mainW-ctx.measureText(title).width)/2),mainY+8);
  ctx.font='11px monospace';ctx.fillStyle='#c9c48f';
  ctx.fillText('1  ONE PLAYER vs CPU',mainX+20,mainY+29);
  ctx.fillText('2  TWO PLAYERS - ONE KEYBOARD',mainX+20,mainY+45);

  ctx.fillStyle='#d6b56f';ctx.font='bold 10px monospace';ctx.fillText('MAP  '+activeMap.name,mainX+20,mainY+67);
  ctx.fillStyle='#8f9276';ctx.font='8px monospace';ctx.fillText('MAP: LEFT/RIGHT or M',mainX+20,mainY+84);

  const hx=mainX+Math.min(260,Math.round(mainW*.56));
  ctx.fillStyle='#c8d07c';ctx.font='bold 9px monospace';ctx.fillText('P1/SINGLE',hx,mainY+67);
  ctx.fillStyle='#aaa98f';ctx.font='8px monospace';ctx.fillText('KEY 3: VULN '+vulnerabilityLabel(0)+'   KEY 4: SETS '+vehicleSetsLabel(0),hx,mainY+79);
  ctx.fillStyle='#e3a18f';ctx.font='bold 9px monospace';ctx.fillText('P2/COMPUTER',hx,mainY+91);
  ctx.fillStyle='#aaa98f';ctx.font='8px monospace';ctx.fillText('KEY 5: VULN '+vulnerabilityLabel(1)+'   KEY 6: SETS '+vehicleSetsLabel(1),hx,mainY+103);
  ctx.fillStyle='#d2c77a';ctx.font='8px monospace';ctx.fillText('KEY 7: CPU VEHICLES AT ONCE '+cpuMaxActive(),hx,mainY+115);

  const tableY=mainY+mainH+gap;
  const tableW=Math.min(470,W-margin*2);
  const tableX=Math.round((W-tableW)/2);
  const tableH=Math.max(120,H-tableY-margin);
  drawControlTable(tableX,tableY,tableW,tableH);
  ctx.restore();
}
function localStatusText(v,p){
  if(p.mode==='select')return 'SELECT';if(p.mode==='deploying')return 'DEPLOY';if(p.mode==='returning')return 'STOW';if(!v.alive)return 'DOWN';
  return 'S'+Math.round(Math.abs(v.speed));
}
function healthRatio(v){return v&&v.alive&&v.maxHealth?clamp(v.health/v.maxHealth,0,1):0;}
function ammoRatio(v){const a=currentAmmo(v);return a.max>0?clamp(a.value/a.max,0,1):0;}
function drawHudBar(x,y,w,ratio,kind='health'){
  ratio=clamp(ratio,0,1);
  ctx.fillStyle='#3b403a';ctx.fillRect(x,y,w,4);
  ctx.strokeStyle='#686d61';ctx.strokeRect(x+.5,y+.5,w-1,3);
  if(ratio<=0)return;
  if(kind==='ammo')ctx.fillStyle=ratio>.25?'#c5b85f':'#b86a50';
  else ctx.fillStyle=ratio>.5?'#a7aa70':ratio>.2?'#c5a15a':'#b85a50';
  ctx.fillRect(x+1,y+1,(w-2)*ratio,2);
}
function drawSplitPlayerHud(team,xOffset,yOffset=0){
  const v=team===0?player:cpu,p=team===0?pool:cpuPool,other=team===0?cpu:player;
  const uiX=Math.round((W-BASE_W)*.5);
  const hudShift=H-BASE_H;
  // The HUD remains the original 480px-wide pixel-art panel, centered when a
  // viewport becomes wider. Its bar is anchored to the actual bottom edge.
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#303431';ctx.fillRect(xOffset,yOffset+VIEW_H,W,HUD_PIXEL_H);
  ctx.fillStyle='#555952';ctx.fillRect(xOffset,yOffset+VIEW_H,W,3);
  ctx.restore();
  ctx.save();ctx.setTransform(SCALE,0,0,SCALE,xOffset+uiX,yOffset+hudShift);
  ctx.fillStyle='#202522';ctx.fillRect(6,164,103,30);ctx.fillRect(116,164,73,30);ctx.fillRect(196,164,118,30);
  ctx.strokeStyle='#777b70';ctx.strokeRect(6.5,164.5,102,29);ctx.strokeRect(116.5,164.5,72,29);ctx.strokeRect(196.5,164.5,117,29);
  ctx.font='7px monospace';ctx.textBaseline='top';
  ctx.fillStyle=team===0?'#c8d07c':'#d68a78';
  const localState=localStatusText(v,p),flagSuffix=v.carryingFlagTeam!==null?' F':'';
  ctx.fillText((team===0?'P1 ':'P2 ')+(v.typeDef?.short||'TANK')+' '+localState+flagSuffix,11,168);
  ctx.fillStyle='#9e9a78';ctx.fillText('ARM',11,178);drawHudBar(31,178,69,healthRatio(v),'health');
  ctx.fillStyle='#9e9a78';ctx.fillText('AM',11,187);drawHudBar(31,187,69,ammoRatio(v),'ammo');
  ctx.fillStyle='#d8d2a5';ctx.fillText('RADAR',130,168);ctx.fillStyle='#14251f';ctx.fillRect(124,176,57,14);ctx.strokeStyle='#416556';ctx.strokeRect(124.5,176.5,56,13);
  const dot=(o,color)=>{const x=124+clamp(o.x/world.width,0,1)*57,y=176+clamp(o.z/world.depth,0,1)*14;ctx.fillStyle=color;ctx.fillRect(x|0,y|0,2,2);};
  if(player.alive)dot(player,'#c8d07c');if(cpu.alive)dot(cpu,'#d68a78');for(const v of cpuReinforcements)if(v.alive)dot(v,'#d68a78');for(const f of flags)if(f.state!=='hidden'&&f.state!=='captured')dot(f,f.team===0?'#78a5cf':'#d16a5f');
  const ammo=currentAmmo(v);let weapon=(v.weapon||'--').toUpperCase();
  if(v.type==='tank')weapon='SHELL G/A';else if(v.type==='helicopter')weapon=(v.selectedWeapon==='rocket'?'RKT':'SHELL')+' G/A';else if(v.type==='asv')weapon='RKT G/A';else if(v.type==='jeep')weapon='GRENADE';
  ctx.fillStyle='#d8d2a5';ctx.fillText(weapon,201,168);
  ctx.fillStyle='#9e9a78';ctx.fillText(other.alive?'ENEMY':'ENEMY DOWN',201,178);
  if(other.alive)drawHudBar(242,178,63,healthRatio(other),'health');
  const enemyFlag=flags[1-team];let st='FLAG '+enemyFlag.state.toUpperCase();
  if(v.carryingFlagTeam===1-team)st='RETURN FLAG HOME';else if(enemyFlag.state==='exposed'&&v.type!=='jeep')st='FLAG EXPOSED - NEED JEEP';
  ctx.fillText(st,201,187);
  ctx.restore();

  // Selection/win overlays belong to the 3D view, not to the bottom-anchored HUD.
  ctx.save();ctx.setTransform(SCALE,0,0,SCALE,xOffset+uiX,yOffset);
  if(matchWinner!==null){
    ctx.fillStyle='rgba(15,18,16,.90)';ctx.fillRect(67,63,186,38);ctx.strokeStyle='#c7bd77';ctx.strokeRect(67.5,63.5,185,37);
    ctx.fillStyle='#e4dda2';ctx.font='11px monospace';ctx.fillText(matchWinner===team?'YOU CAPTURED THE FLAG':'OPPONENT CAPTURED FLAG',82,73);
    ctx.font='7px monospace';ctx.fillStyle='#aaa57f';ctx.fillText('R: REMATCH   ESC: MODE MENU',93,88);
  }
  ctx.restore();
  if(matchWinner===null&&p.mode==='select')drawPoolSelectionScreen(team,xOffset,yOffset);
}
function drawHud(){
  const uiX=Math.round((W-BASE_W)*.5),hudShift=H-BASE_H;
  if(gameMode===null){drawModeSelection();return;}
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#303431';ctx.fillRect(0,VIEW_H,W,HUD_PIXEL_H);
  ctx.fillStyle='#555952';ctx.fillRect(0,VIEW_H,W,3);
  ctx.restore();
  ctx.save();ctx.setTransform(SCALE,0,0,SCALE,uiX,hudShift);
  ctx.fillStyle='#202522';ctx.fillRect(7,164,86,30);ctx.fillRect(101,164,75,30);ctx.fillRect(184,164,129,30);
  ctx.strokeStyle='#777b70';ctx.strokeRect(7.5,164.5,85,29);ctx.strokeRect(101.5,164.5,74,29);ctx.strokeRect(184.5,164.5,128,29);
  ctx.fillStyle='#d8d2a5';ctx.font='7px monospace';ctx.textBaseline='top';
  const td=player.typeDef||VEHICLE_TYPES.tank;
  const displaySpeed=Math.abs(player.speed);
  ctx.fillText(td.short+' 01',12,168);
  ctx.fillText('SPD '+String(Math.round(displaySpeed)).padStart(3,'0')+(!player.airborne&&debrisSpeedFactorAt(player.x,player.z,player.radius)<1?' RUBBLE':''),12,178);
  ctx.fillText('ARM',12,187);
  const hpRatio=player.maxHealth?clamp(player.health/player.maxHealth,0,1):0;
  ctx.fillStyle='#545a4c';ctx.fillRect(31,187,54,4);ctx.fillStyle=hpRatio>.5?'#a7aa70':hpRatio>.2?'#c5a15a':'#b85a50';ctx.fillRect(31,187,54*hpRatio,4);

  ctx.fillStyle='#d8d2a5';ctx.fillText('RADAR',106,168);
  ctx.fillStyle='#14251f';ctx.fillRect(115,176,47,14);ctx.strokeStyle='#416556';ctx.strokeRect(115.5,176.5,46,13);
  const rx=115+clamp(player.x/world.width,0,1)*47,ry=176+clamp(player.z/world.depth,0,1)*14;
  const ex=115+clamp(cpu.x/world.width,0,1)*47,ey=176+clamp(cpu.z/world.depth,0,1)*14;
  if(pool.mode!=='select'){ctx.fillStyle='#c8d07c';ctx.fillRect(rx|0,ry|0,2,2);}if(cpu.alive){ctx.fillStyle='#c97062';ctx.fillRect(ex|0,ey|0,2,2);}
  for(const f of flags){
    if(f.state==='hidden'||f.state==='captured')continue;
    const fx=115+clamp(f.x/world.width,0,1)*47,fy=176+clamp(f.z/world.depth,0,1)*14;
    ctx.fillStyle=f.team===0?'#78a5cf':'#d16a5f';ctx.fillRect(fx|0,fy|0,2,2);
  }
  for(const d of ammoDepots){
    const dx=115+clamp(d.x/world.width,0,1)*47,dy=176+clamp(d.z/world.depth,0,1)*14;
    ctx.fillStyle=depotAvailable(d)?(d.team===0?'#9ab16f':'#b87969'):'#55534b';ctx.fillRect(dx|0,dy|0,2,1);
  }

  let weaponLabel=(player.weapon||'--').toUpperCase();
  if(player.type==='helicopter')weaponLabel=(player.selectedWeapon==='rocket'?'RKT':'SHELL')+' G/A';
  else if(player.type==='tank')weaponLabel='SHELL G/A';
  else if(player.type==='asv')weaponLabel='RKT G/A';
  else if(player.type==='jeep')weaponLabel='GRENADE';
  ctx.fillStyle='#d8d2a5';ctx.fillText(weaponLabel,190,168);
  const ammo=currentAmmo(player);
  ctx.fillStyle='#9e9a78';ctx.fillText('AM',190,178);drawHudBar(207,178,62,ammoRatio(player),'ammo');
  let weaponState=pool.mode==='select'?'SELECT':pool.mode==='deploying'?'DEPLOY':pool.mode==='returning'?'STOW':ammo.value<=0?'EMPTY':player.cooldown<=0?'READY':'RELOAD';
  ctx.fillText(weaponState,275,178);
  if(gameMode==='single'){
    const targets=activeCpuVehicles();
    let target=null,best=Infinity;for(const v of targets){const q=Math.hypot(v.x-player.x,v.z-player.z);if(q<best){best=q;target=v;}}
    ctx.fillStyle='#d8d2a5';ctx.fillText('CPU '+cpuConcurrentCount()+'/'+cpuMaxActive(),250,168);
    if(target){ctx.fillStyle='#9e9a78';ctx.fillText('TGT',275,187);drawHudBar(294,187,16,healthRatio(target),'health');}
  }else{
    ctx.fillStyle='#d8d2a5';ctx.fillText(cpu.alive?'TARGET':'TARGET DOWN',240,178);
    if(cpu.alive){drawHudBar(275,178,34,healthRatio(cpu),'health');ctx.fillStyle='#9e9a78';ctx.fillText('P2 '+cpu.type.toUpperCase(),218,187);}
  }
  if(player.type==='asv'){ctx.fillStyle='#9e9a78';ctx.fillText('M '+player.minesLeft,291,168);}

  const enemyTowers=sceneObjects.filter(o=>o.kind==='tower'&&o.team===1&&o.alive).length;
  const returnSpeed=Math.abs(player.speed);
  const enemyFlag=flags[1];
  let flagText='FLAG '+enemyFlag.state.toUpperCase();
  if(player.carryingFlagTeam===1)flagText='FLAG: RETURN HOME';
  if(enemyFlag.state==='exposed'&&player.type!=='jeep')flagText='FLAG EXPOSED - NEED JEEP';
  ctx.fillStyle='#9e9a78';
  const inDepot=pool.mode==='active'&&vehicleInOwnDepot(player);
  if(inDepot&&vehicleNeedsDepotResupply(player)&&Math.abs(player.speed)<=DEPOT_STOP_SPEED){
    const pct=Math.round(clamp((player.resupplyTimer||0)/DEPOT_RESUPPLY_TIME,0,1)*100);
    ctx.fillText('AMMO DEPOT '+pct+'%',190,188);
  }else if((player.resupplyFlash||0)>0)ctx.fillText('AMMUNITION REFILLED',190,188);
  else if(inDepot&&!vehicleNeedsDepotResupply(player))ctx.fillText('AMMO DEPOT - FULL',190,188);
  else if(pool.mode==='active'&&nearPlayerTrapdoor()&&returnSpeed<=82&&player.carryingFlagTeam===null)ctx.fillText('MOTOR POOL READY',190,188);
  else ctx.fillText(flagText+'  T:'+enemyTowers,190,188);

  if(matchWinner!==null){
    ctx.fillStyle='rgba(15,18,16,.88)';ctx.fillRect(68,63,184,38);ctx.strokeStyle='#c7bd77';ctx.strokeRect(68.5,63.5,183,37);
    ctx.fillStyle='#e4dda2';ctx.font='11px monospace';ctx.fillText(matchWinner===0?'FLAG CAPTURED - YOU WIN':'FLAG LOST - CPU WINS',87,73);
    ctx.font='7px monospace';ctx.fillStyle='#aaa57f';ctx.fillText('PRESS R TO START A NEW MATCH',91,88);
  }else if(pool.mode==='deploying'||pool.mode==='returning'){
    ctx.fillStyle='rgba(20,24,21,.78)';ctx.fillRect(102,67,116,24);ctx.strokeStyle='#777b70';ctx.strokeRect(102.5,67.5,115,23);
    ctx.fillStyle='#d8d2a5';ctx.font='8px monospace';ctx.fillText(pool.mode==='deploying'?'DEPLOYING '+td.name:'RETURNING TO BASE',112,75);
  }
  ctx.restore();
  if(matchWinner===null&&pool.mode==='select')drawPoolSelectionScreen(0,0,0);
}

function render(){
  if(gameMode==='local2'){
    camera=cameraP1;buildScene();rasterize(0,0);drawSplitPlayerHud(0,0,0);
    camera=cameraP2;buildScene();rasterize(W,0);drawSplitPlayerHud(1,W,0);
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0a0d0c';ctx.fillRect(W-2,0,4,H);ctx.strokeStyle='#777b70';ctx.beginPath();ctx.moveTo(W+.5,0);ctx.lineTo(W+.5,H);ctx.stroke();ctx.restore();
    camera=cameraP1;return;
  }
  camera=cameraP1;buildScene();rasterize(0,0);drawHud();
}

let animTime=0;
let prev=performance.now();
function tick(now){
  const dt=Math.min((now-prev)/1000,.05);prev=now;animTime+=dt;
  updatePool(dt);
  if(gameMode==='local2')updateP2Pool(dt);else if(gameMode==='single'){updateCpuPool(dt);updateCpuSpawnManager(dt);}
  updatePlayer(dt);
  if(gameMode==='local2')updatePlayer2(dt);else if(gameMode==='single'){updateCPU(dt);updateCpuReinforcements(dt);}
  checkHelicopterCrash();
  updateAmmoDepots(dt);updateTowers(dt);updateProjectiles(dt);updateMines(dt);updateFlags();updateCameras(dt,false);updateAudio();render();
  requestAnimationFrame(tick);
}

badgeEl.style.display='block';applyCanvasLayout();reset();render();requestAnimationFrame(tick);
})();
</script>
</body>
